<style>
/* Layout: a classroom lab. Top: pick your game. Then 4 stations: The Box, Name or Value?, Say it right, Mix-up pairs. Big-text mode for the projector. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --sunk:#E7ECF3; --ink:#18202B; --muted:#586374; --line:#D3DBE6;
  --accent:#2F5BD3; --accent-ink:#FFFFFF; --accent-soft:#DFE7FB;
  --var:#FF8C1A; --var-ink:#FFFFFF; --var-deep:#DB6E00;
  --val:#FFFFFF; --val-ink:#1D2430; --val-line:#C9D2DE;
  --event:#FFBF00; --control:#FFAB19; --operator:#59C059; --looks:#9966FF; --custom:#FF6680; --list:#FF661A;
  --box:#C98A4B; --box-dark:#9A6331; --box-ink:#3B2410;
  --good:#1E8A4C; --good-soft:#DDF3E5; --bad:#C2382B; --bad-soft:#FBE3E0;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --fs:17px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151C; --surface:#18202A; --sunk:#202A36; --ink:#E8EEF6; --muted:#9FAABA; --line:#2E3A48;
  --accent:#8EA9FF; --accent-ink:#0E1A3D; --accent-soft:#22305A;
  --val:#F4F6FA; --val-ink:#18202B; --val-line:#8C97A6;
  --box:#B07A42; --box-dark:#7E522A; --box-ink:#2A1708;
  --good:#5FD38E; --good-soft:#173A27; --bad:#FF8A80; --bad-soft:#41201D; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --sunk:#202A36; --ink:#E8EEF6; --muted:#9FAABA; --line:#2E3A48;
  --accent:#8EA9FF; --accent-ink:#0E1A3D; --accent-soft:#22305A;
  --val:#F4F6FA; --val-ink:#18202B; --val-line:#8C97A6;
  --box:#B07A42; --box-dark:#7E522A; --box-ink:#2A1708;
  --good:#5FD38E; --good-soft:#173A27; --bad:#FF8A80; --bad-soft:#41201D; color-scheme:dark; }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:var(--fs);line-height:1.5;padding-inline:16px;padding-block:0 60px}
body.big{--fs:22px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(28px,4.4vw,42px);font-weight:700}
h2{font-size:clamp(22px,3.2vw,30px);font-weight:600}
h3{font-size:1.15em;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.top .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-family:var(--display);font-weight:700;font-size:20px;margin-right:auto}
.pick{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px}
.pick select{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:800}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:800}
.tab b{color:var(--accent);margin-right:6px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] b{color:inherit}
.lede{color:var(--muted);max-width:64ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.rule{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 18px;font-family:var(--display);font-size:1.25em;font-weight:600}
.rule .n{color:var(--var)} .rule .v{background:var(--val);color:var(--val-ink);border-radius:6px;padding:0 6px}

/* scratch-like block chips */
.blk{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 10px;font-weight:800;color:#fff;font-size:.95em;flex-wrap:wrap}
.blk.data{background:var(--var)} .blk.event{background:var(--event);color:#3a2a00} .blk.control{background:var(--control)} .blk.looks{background:var(--looks)} .blk.custom{background:var(--custom)} .blk.list{background:var(--list)}
.slot{border-radius:999px;padding:2px 10px;font-weight:800;border:2px solid transparent}
.slot.name{background:var(--var-deep);color:#fff}
.slot.name::after{content:" ▾";font-size:.8em}
.slot.val{background:#fff;color:#1d2430}
.slot.tap{cursor:pointer}
.slot.tap:hover{border-color:#fff;box-shadow:0 0 0 2px var(--ink)}
.slot.right{box-shadow:0 0 0 4px var(--good)}
.slot.wrong{box-shadow:0 0 0 4px var(--bad)}

/* the box */
.lab{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.lab{grid-template-columns:1fr}}
.boxstage{position:relative;height:300px;display:flex;align-items:flex-end;justify-content:center;background:var(--sunk);border-radius:16px;overflow:hidden}
.box{position:relative;width:240px;height:170px;margin-bottom:26px}
.box .back{position:absolute;inset:0 0 auto 0;height:60px;background:var(--box-dark);border-radius:10px 10px 0 0;transform:skewX(-8deg);transform-origin:bottom}
.box .front{position:absolute;inset:40px 0 0 0;background:var(--box);border-radius:6px 6px 12px 12px;border:3px solid var(--box-dark);display:flex;align-items:center;justify-content:center;z-index:3}
.label{background:var(--var);color:var(--var-ink);font-family:var(--display);font-weight:700;font-size:1.35em;padding:6px 16px;border-radius:8px;box-shadow:0 3px 0 var(--var-deep);transform:rotate(-2deg);max-width:210px;text-align:center}
.label.pulse{animation:pulse .6s ease}
@keyframes pulse{0%{transform:rotate(-2deg) scale(1)}40%{transform:rotate(-2deg) scale(1.12)}100%{transform:rotate(-2deg) scale(1)}}
.valcard{position:absolute;left:50%;top:-34px;transform:translateX(-50%);z-index:2;background:var(--val);color:var(--val-ink);border:2px solid var(--val-line);border-radius:10px;padding:8px 18px;font-family:var(--display);font-weight:700;font-size:1.8em;min-width:110px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.15);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s}
.valcard.out{transform:translate(160%,-120%) rotate(18deg);opacity:0}
.valcard.in{transform:translate(-50%,-160%);opacity:0}
.tagN,.tagV{position:absolute;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
.tagN{left:12px;top:12px;background:var(--var);color:#fff}
.tagV{right:12px;top:12px;background:var(--val);color:var(--val-ink);border:1.5px solid var(--val-line)}
.monitor{display:inline-flex;align-items:center;gap:6px;background:#E6EDF7;border:1px solid #c5cfdb;border-radius:6px;padding:3px 4px 3px 8px;font-size:14px;color:#575e75;font-weight:700}
.monitor b{background:var(--var);color:#fff;border-radius:4px;padding:1px 8px;min-width:36px;text-align:center}
.steps{display:flex;flex-direction:column;gap:8px}
.stepbtn{display:flex;gap:10px;align-items:center;justify-content:space-between;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.stepbtn:hover{border-color:var(--accent)}
.stepbtn[disabled]{opacity:.45;cursor:default}
.stepbtn small{display:block;color:var(--muted);font-weight:700;font-size:.8em}
.history{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.history span{background:var(--val);color:var(--val-ink);border:1.5px solid var(--val-line);border-radius:8px;padding:2px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.history span.now{outline:3px solid var(--var)}
.say{font-family:var(--display);font-size:1.2em;font-weight:600}
.say .n{color:var(--var-deep)}
.mini{display:flex;gap:18px;flex-wrap:wrap}
.minibox{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sunk);border-radius:14px;padding:14px 16px;min-width:150px}
.minibox .label{font-size:1em}
.minibox .vc{background:var(--val);color:var(--val-ink);border:2px solid var(--val-line);border-radius:8px;padding:4px 14px;font-family:var(--display);font-weight:700;font-size:1.4em}

/* quiz */
.qwrap{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.qprompt{font-family:var(--display);font-size:1.5em;font-weight:600}
.qprompt .n{color:var(--var-deep)}
.feedback{font-weight:800;font-size:1.1em;padding:10px 14px;border-radius:10px}
.feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
.dots{display:flex;gap:4px}
.dots i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.dots i.r{background:var(--good)} .dots i.w{background:var(--bad)} .dots i.c{background:var(--accent)}
.sentence{font-size:1.35em;font-weight:700;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.word{border-radius:8px;padding:2px 8px;border:2px dashed var(--line);cursor:pointer;background:var(--surface)}
.word:hover{border-color:var(--accent)}
.word.right{border:2px solid var(--good);background:var(--good-soft)} .word.wrong{border:2px solid var(--bad);background:var(--bad-soft)}
.choices{display:flex;flex-direction:column;gap:10px;width:100%}
.choice{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700;font-size:1.1em}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice.right{border-color:var(--good);background:var(--good-soft)} .choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.big-score{font-family:var(--display);font-size:3em;font-weight:700}

/* pairs */
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px;align-items:start}
.pair{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pair .ph{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.pair .side{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pair .side h3{font-size:1.25em}
.pair .vs{display:flex;align-items:center;font-family:var(--display);font-weight:700;color:var(--muted);padding:0 4px}
.pair .side p{font-size:.95em}
.pair .side .eg{font-size:.88em;color:var(--muted)}
.pair .test{border-top:1px solid var(--line);padding:12px 16px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.pair .test b{font-family:var(--display);font-weight:600}
.pair .demo{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.c1{color:var(--accent)} .c2{color:var(--var-deep)}
.listrow{display:flex;gap:6px;flex-wrap:wrap}
.li{display:flex;flex-direction:column;align-items:center;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;min-width:64px;cursor:pointer;background:var(--surface)}
.li span{font-size:12px;font-weight:800;background:var(--list);color:#fff;width:100%;text-align:center}
.li b{padding:4px 8px}
.li.on{outline:3px solid var(--accent)}
.actors{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;min-height:64px}
.actor{width:56px;height:56px;border-radius:12px;background:var(--looks);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;text-align:center;line-height:1.1;transition:transform .3s,opacity .3s}
.actor.dim{opacity:.25}
.actor.hop{transform:translateY(-10px)}
.gate{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gate input{width:160px;accent-color:var(--var)}
.light{font-weight:800;padding:4px 10px;border-radius:999px}
.light.yes{background:var(--good-soft);color:var(--good)} .light.no{background:var(--bad-soft);color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

// ---------------- Station 1: the box ----------------
function boxStation(){
  const H = HERO[game];
  const wrap = el('div','stack');

  wrap.append(rule);
  const lab = el('div','lab');
  // left: the box
  const left = el('div','stack');
  const stage = el('div','boxstage');
  const box = el('div','box'); const back = el('div','back'); const front = el('div','front'); const label = el('div','label', H.n);
  front.append(label); const card = el('div','valcard', '?'); box.append(back, card, front);
  const tN = el('span','tagN','Name: never changes'); const tV = el('span','tagV','Value: changes');
  stage.append(box, tN, tV); left.append(stage);
  const mon = el('div','row'); const m = el('span','monitor'); const mb = el('b', null, '?'); m.append(document.createTextNode(H.n), mb);

  const hist = el('div','stack'); hist.append(el('h3', null, 'Every value this box has held')); const hrow = el('div','history'); hist.append(hrow);

  // right: the steps

  right.append(el('h2', null, 'Play the story'), el('p','lede', H.why + ' Press the steps in order and watch: only the card changes.'));
  const list = el('div','steps'); right.append(list);
  let value = null, idx = 0; const values = [];
  const btns = H.steps.map((s, i) => {
    const b = el('button','stepbtn'); b.type = 'button';
    const blk = s[0] === 'set' ? setBlock(H.n, s[1] || fmt(s[2])) : setBlock(H.n, fmt(s[1]), {verb:'change', mid:'by'});
    const txt = el('span'); txt.append(el('small', null, 'Step ' + (i + 1) + ' · ' + s[3]), blk.node);
    b.append(txt); b.disabled = i !== 0;
    b.addEventListener('click', () => run(i));
    list.append(b); return b;
  });
  function run(i){
    const s = H.steps[i]; const old = value;
    value = s[0] === 'set' ? Number(s[2]) : (Number(old) + Number(s[1]));
    values.push(value);
    card.classList.add('out');
    setTimeout(() => { card.textContent = fmt(value); card.classList.remove('out'); card.classList.add('in'); requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove('in'))); }, 300);
    label.classList.remove('pulse'); void label.offsetWidth; label.classList.add('pulse');
    mb.textContent = fmt(value);
    if (s[0] === 'set') say.innerHTML = 'Put <b>' + fmt(value) + '</b> into the <span class="n">' + H.n + '</span> box.' + (s[1] ? ' (' + fmt(s[2]) + ' came from the <span class="n">' + s[1] + '</span> box.)' : '');
    else say.innerHTML = 'Take the card out, ' + (Number(s[1]) < 0 ? 'take away ' + fmt(-Number(s[1])) : 'add ' + fmt(s[1])) + ', put the new card in. The <span class="n">' + H.n + '</span> box now holds <b>' + fmt(value) + '</b>.';
    hrow.innerHTML = ''; values.forEach((v, k) => { const sp = el('span', k === values.length - 1 ? 'now' : '', fmt(v)); hrow.append(sp); });

  }

  // same value, different names  +  copying
  const g2 = el('div','grid2');

  const twins = findTwins(r);
  const c1 = el('div','card stack'); c1.append(el('h3', null, 'Same value, different variables'));
  const mini = el('div','mini');
  if (twins){ twins.forEach(x => mini.append(miniBox(x.n, fmt(x.v)))); c1.append(mini, el('p', null, 'Both boxes hold ' + fmt(twins[0].v) + ', but they are two DIFFERENT variables with two different jobs. The value does not tell you which box it is. The name does.')); }
  else { const a = r[0], b2 = r[1]; mini.append(miniBox(a.n, fmt(a.v)), miniBox(b2.n, fmt(b2.v))); c1.append(mini, el('p', null, 'Two different boxes, two different names. Each name tells you what the number is FOR.')); }

function miniBox(n, v){ const b = el('div','minibox'); b.append(el('div','vc', v), el('div','label', n)); return b; }
function findTwins(rules){
  const by = {}; rules.forEach(x => { (by[x.v] = by[x.v] || []).push(x); });
  const k = Object.keys(by).find(v => by[v].length > 1); return k ? by[k].slice(0, 2) : null;
}
const COPY = {honest:['Trust','Start Trust','50'], realfake:['Hearts','Start Hearts','3'], jobboard:['Limit','Urgent Time','3.5'], maze:['Price ₦','Start Price','10,000'],
  naira:['Month 1 Cost','Full Cost ₦','5,000'], barn:['Vaccines Left','Vaccines','3'], wise:['Pocket ₦','Pocket Money','1,000'], rot:['Rate','Open Air Rot','5'], owambe:['Budget Left ₦','Budget ₦','200,000']};

// ---------------- Station 2: name or value? ----------------
function makeQuestions(){
  const R = KB[game].rules.filter(x => x.v !== '');
  const H = HERO[game];
  const qs = [];
  shuffle(R).slice(0, 4).forEach(x => qs.push({t:'block', n:x.n, v:fmt(x.v), ask: Math.random() < .5 ? 'name' : 'value'}));
  shuffle(R).slice(0, 3).forEach(x => qs.push({t:'sentence', n:x.n, v:fmt(x.v), ask: Math.random() < .5 ? 'name' : 'value'}));
  qs.push({t:'monitor', n:H.n, v:fmt(H.steps[0][2]), ask:'value'});
  qs.push({t:'monitor', n:H.n, v:fmt(H.steps[0][2]), ask:'name'});
  const x = pick(R); qs.push({t:'which', n:x.n, v:fmt(x.v)});
  return shuffle(qs).slice(0, 10);
}
function spotStation(){
  const Q = {qs: makeQuestions(), i:0, score:0, marks:[]};
  const wrap = el('div','stack');
  const rule = el('div','rule'); rule.innerHTML = 'Find the <span class="n">NAME</span> (the label on the box) or the <span class="v">VALUE</span> (the card inside).';
  wrap.append(rule);
  const card = el('div','card'); wrap.append(card);
  function show(){
    card.innerHTML = '';
    if (Q.i >= Q.qs.length){ return finish(); }
    const q = Q.qs[Q.i]; const box = el('div','qwrap');
    const dots = el('div','dots'); Q.qs.forEach((_, k) => dots.append(el('i', k < Q.i ? (Q.marks[k] ? 'r' : 'w') : k === Q.i ? 'c' : '')));
    box.append(dots);
    const fb = el('p','feedback'); fb.hidden = true;
    const next = el('button','btn primary', Q.i + 1 < Q.qs.length ? 'Next' : 'See my score'); next.type = 'button'; next.hidden = true;
    next.addEventListener('click', () => { Q.i++; show(); });
    const answer = (ok, msg) => { Q.marks.push(ok); if (ok) Q.score++; fb.hidden = false; fb.className = 'feedback ' + (ok ? 'ok' : 'no'); fb.textContent = msg; next.hidden = false; };
    if (q.t === 'block' || q.t === 'monitor'){
      box.append(el('p','qprompt', q.ask === 'name' ? 'Tap the NAME of the variable.' : 'Tap the VALUE.'));
      let parts;
      if (q.t === 'block'){ const b = setBlock(q.n, q.v); parts = {name:b.nameEl, value:b.valEl}; box.append(b.node); }
      else { const m = el('span','monitor'); m.style.fontSize = '1.2em'; const nn = el('span','slot', q.n); nn.style.color = '#575e75'; const vv = el('b', null, q.v); m.append(nn, vv); parts = {name:nn, value:vv}; box.append(el('p','small','This is a variable showing on the Scratch stage:'), m); }
      let done = false;
      Object.entries(parts).forEach(([k, node]) => { node.classList.add('tap'); node.addEventListener('click', () => {
        if (done) return; done = true; const ok = k === q.ask; node.classList.add(ok ? 'right' : 'wrong'); if (!ok) parts[q.ask].classList.add('right');
        answer(ok, ok ? (q.ask === 'name' ? 'Yes! "' + q.n + '" is the name: the label on the box.' : 'Yes! ' + q.v + ' is the value: the card inside.')
                      : (q.ask === 'name' ? 'Not quite. ' + q.v + ' is the VALUE (the card). The NAME is "' + q.n + '".' : 'Not quite. "' + q.n + '" is the NAME (the label). The VALUE is ' + q.v + '.'));
      }); });
    } else if (q.t === 'sentence'){
      box.append(el('p','qprompt', q.ask === 'name' ? 'Tap the word that is the VARIABLE (the box).' : 'Tap the VALUE (what is inside).'));
      const s = el('div','sentence'); const words = ['The', q.n, 'box', 'holds', q.v, 'now.']; let done = false; const nodes = [];
      words.forEach((w, k) => { const sp = el('span','word', w); nodes.push(sp); sp.addEventListener('click', () => {
        if (done) return; done = true; const target = q.ask === 'name' ? 1 : 4; const ok = k === target;
        sp.classList.add(ok ? 'right' : 'wrong'); if (!ok) nodes[target].classList.add('right');
        answer(ok, ok ? 'Correct.' : 'The ' + (q.ask === 'name' ? 'variable is "' + q.n + '"' : 'value is ' + q.v) + '.');
      }); s.append(sp); });
      box.append(s);
    } else {
      box.append(el('p','qprompt', 'In "set [' + q.n + '] to (' + q.v + ')", which sentence is true?'));
      const opts = shuffle([[true, q.n + ' is the variable. ' + q.v + ' is its value right now.'], [false, q.v + ' is the variable.'], [false, q.n + ' and ' + q.v + ' are both variables.']]);
      const ch = el('div','choices'); let done = false;
      opts.forEach(([ok, txt]) => { const b = el('button','choice', txt); b.type = 'button'; b.addEventListener('click', () => {
        if (done) return; done = true; b.classList.add(ok ? 'right' : 'wrong'); [...ch.children].forEach(c => c.disabled = true);
        if (!ok) [...ch.children].find(c => c.textContent.startsWith(q.n + ' is the variable')).classList.add('right');
        answer(ok, ok ? 'Yes. The name is the variable; the number is only what it holds right now.' : 'Not quite. The variable is the NAMED BOX. The number is just the card inside.');
      }); ch.append(b); }); box.append(ch);
    }
    box.append(fb, next); card.append(box);
  }
  function finish(){
    const b = el('div','qwrap');
    b.append(el('p','big-score', Q.score + ' / ' + Q.qs.length), el('p','qprompt', Q.score >= 9 ? 'Excellent. You can tell a name from a value.' : Q.score >= 6 ? 'Good. Play again to make it automatic.' : 'Go back to station 1 and play the box story once more.'));
    const again = el('button','btn primary','Play again with new questions'); again.type = 'button'; again.addEventListener('click', () => { Q.qs = makeQuestions(); Q.i = 0; Q.score = 0; Q.marks = []; show(); });
    b.append(again); card.append(b);
  }
  show();
  return wrap;
}

// ---------------- Station 3: say it right ----------------
function sayStation(){
  const H = HERO[game]; const R = KB[game].rules.filter(x => x.v !== '');
  const r1 = R[0], r2 = R[Math.min(1, R.length - 1)];
  const v0 = fmt(H.steps[0][2]);
  const pairs = shuffle([
    ['"' + H.n + ' is ' + v0 + '."', 'The ' + H.n + ' box holds ' + v0 + ' right now.', 'Say "holds" or "right now". The value can change; the box stays.'],
    [v0 + ' is the variable.', H.n + ' is the variable. ' + v0 + ' is its value.', 'The variable is always the NAME.'],
    ['We changed the variable to ' + fmt(r1.v) + '.', 'We put ' + fmt(r1.v) + ' into the ' + r1.n + ' box.', 'We never change the box itself. We change what is inside.'],
    ['The variable went up.', 'The value inside ' + H.n + ' went up.', 'Boxes do not grow. Values do.'],
    [r2.n + ' is a number.', r2.n + ' is a variable that holds a number (' + fmt(r2.v) + ').', 'A variable is a box. A number is something you can put in it.'],

  pairs.forEach((p, i) => {

    shuffle([[false, p[0]], [true, p[1]]]).forEach(([ok, txt]) => { const b = el('button','choice', txt); b.type = 'button'; b.addEventListener('click', () => {
      if (done) return; done = true; b.classList.add(ok ? 'right' : 'wrong'); [...ch.children].forEach(x => x.disabled = true);
      if (!ok) [...ch.children].find(x => x.textContent === p[1]).classList.add('right');
