<script>
(function(){
"use strict";
const KB = JSON.parse(document.getElementById('kb').textContent);
const SHOW_DATE = new Date('2026-10-22T09:00:00+01:00');
const SCHOOLS = [
  {id:'methodist', name:'Methodist High School', games:['honest','realfake','jobboard']},
  {id:'unity', name:'Unity High School', games:['maze','naira','barn']},
  {id:'yewa', name:'Yewa College', games:['wise','rot','owambe']},
];
const ROLES = {
  vars:{label:'Variables & logic speaker', short:'Variables & logic', blurb:'You explain every variable: why we made it, what changes it, what happens, and how many times.'},
  sprites:{label:'Scenes & sprites speaker', short:'Scenes & sprites', blurb:'You explain how many scenes there are, what starts each one, and how the sprites move and clone.'},
};
const SEATS = [];
SCHOOLS.forEach(s => ['vars','sprites'].forEach(r => SEATS.push({id:s.id+'-'+r, school:s.id, role:r})));
const KIND = {
  rule:'Rule number: a setting we choose before the game. It never changes during play.',
  counter:'Counter: counts something up or down.',
  switch:'Switch: 0 = off, 1 = on.',
  memory:'Memory: remembers a value for later.',
  message:'Message holder: holds a word that picks a costume or a story path.',
  helper:'Helper: a working-out value used inside a calculation or a loop.',
  list:'List: many values in order, read with "item N of".',
};
const RATE = [null, 'Not yet', 'Getting there', 'I can explain it'];

// ---------- knowledge helpers ----------
function proj(pid){ return pid === 'shared' ? KB.shared : KB.projects[pid]; }
function title(pid){ const t = proj(pid).title; return pid === 'shared' ? 'Shared parts (every game)' : t.replace(/ v2\.1$/,''); }
function slug(s){ return String(s).toLowerCase().replace(/₦/g,'n').replace(/%/g,'pc').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60) || 'x'; }
function vkey(pid, v){ return pid+'__v__'+slug(v.name); }
function skey(pid, s){ return pid+'__s__'+slug(s.name); }
function sckey(pid){ return pid+'__scenes'; }
function school(id){ return SCHOOLS.find(s => s.id === id); }
function seat(id){ return SEATS.find(s => s.id === id); }
function seatGames(st){ return school(st.school).games; }
function checklist(st){
  const items = [];
  const games = seatGames(st);
  if (st.role === 'vars'){
    games.forEach(g => proj(g).variables.forEach(v => items.push(vkey(g, v))));
    KB.shared.variables.forEach(v => items.push(vkey('shared', v)));
  } else {
    games.forEach(g => { items.push(sckey(g)); proj(g).sprites.forEach(s => items.push(skey(g, s))); });
    KB.shared.sprites.forEach(s => items.push(skey('shared', s)));
  }
  return items;
}
function projItems(pid, role){
  const p = proj(pid), out = [];
  if (role === 'vars') p.variables.forEach(v => out.push(vkey(pid, v)));
  else { if (p.scenes) out.push(sckey(pid)); p.sprites.forEach(s => out.push(skey(pid, s))); }
  return out;
}

// ---------- state & storage ----------
const state = {
  mode:'local', seats:{}, progress:{}, me:null, isTrainer:false,
  view:{name:/[?&]trainer\b/.test(location.search)?'trainer':'seats'}, hide:false, drafts:{},
};
let db = null, userCap = null;
const LS = 'scc-v1';
function lsRead(){ try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch(e){ return null; } }
function lsWrite(){ if (state.mode !== 'local') return; try { localStorage.setItem(LS, JSON.stringify({seats:state.seats, progress:state.progress})); } catch(e){} }
function prefs(){ try { return JSON.parse(localStorage.getItem(LS+'-me') || '{}'); } catch(e){ return {}; } }
function savePrefs(p){ try { localStorage.setItem(LS+'-me', JSON.stringify(p)); } catch(e){} }

function prog(seatId){ return state.progress[seatId] || {items:{}}; }
function item(seatId, key){ return (prog(seatId).items || {})[key] || {}; }
function seatName(seatId){ const s = state.seats[seatId]; return (s && s.name) || ''; }

const chains = {};
function queue(id, fn){ chains[id] = (chains[id] || Promise.resolve()).then(fn).catch(e => { console.warn(e); toast(e && e.code === 'invalid_argument' ? 'You can look, but this account cannot save.' : 'Could not save. Check the connection.'); }); return chains[id]; }
function deepMerge(a, b){ const o = Object.assign({}, a); for (const k in b){ const bv = b[k]; o[k] = (bv && typeof bv === 'object' && !Array.isArray(bv) && a && typeof a[k] === 'object' && !Array.isArray(a[k])) ? deepMerge(a[k], bv) : bv; } return o; }
const existsRemote = {};

function writeProgress(seatId, patch){
  patch.updatedAt = Date.now();
  state.progress[seatId] = deepMerge(prog(seatId), patch);
  if (!state.progress[seatId].items) state.progress[seatId].items = {};
  if (state.mode === 'local'){ lsWrite(); return Promise.resolve(); }
  return queue('p-'+seatId, async () => {
    const ref = db.doc('progress/'+seatId);
    if (existsRemote['p-'+seatId]) await ref.update(patch);
    else { await ref.set(state.progress[seatId]); existsRemote['p-'+seatId] = true; }
  });
}
function saveItem(seatId, key, fields){ return writeProgress(seatId, {items:{[key]:Object.assign({t:Date.now()}, fields)}}); }
function saveSeatName(seatId, name){
  state.seats[seatId] = {name:name, updatedAt:Date.now()};
  if (state.mode === 'local'){ lsWrite(); return; }
  queue('s-'+seatId, () => db.doc('seats/'+seatId).set(state.seats[seatId]));
}

let pendingRender = false;
function softRender(){
  const a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')) { pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', () => { setTimeout(() => { if (pendingRender){ const a = document.activeElement; if (!a || (a.tagName !== 'TEXTAREA' && a.tagName !== 'INPUT')){ pendingRender = false; render(); } } }, 50); });

async function connect(){
  const local = lsRead();
  if (local){ state.seats = local.seats || {}; state.progress = local.progress || {}; }
  const p = prefs(); if (p.me && seat(p.me)) state.me = p.me;
  if (p.hide) state.hide = true;
  render(); setSync();
  if (!(window.claude && window.claude.use)) { state.isTrainer = true; setSync(); render(); return; }
  try {
    const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    userCap = u;
    if (u){ try { const [o, e] = await Promise.all([u.isOwner(), u.canEdit()]); state.isTrainer = o || e; } catch(e){} }
    if (!d){ state.isTrainer = true; setSync(); render(); return; }
    db = d; state.mode = 'shared'; state.seats = {}; state.progress = {}; setSync('loading');
    db.collection('progress').onSnapshot(snap => {
      snap.docs.forEach(doc => { if (doc.exists){ existsRemote['p-'+doc.id] = true; state.progress[doc.id] = doc.data(); } });
      setSync(); softRender();
    }, err => { console.warn(err); setSync('error'); });
    db.collection('seats').onSnapshot(snap => {
      snap.docs.forEach(doc => { if (doc.exists) state.seats[doc.id] = doc.data(); });
      softRender();
    }, err => console.warn(err));
  } catch(e){ console.warn(e); state.isTrainer = true; setSync(); render(); }
}
function setSync(s){
  const el = document.getElementById('sync');
  if (s === 'loading') el.textContent = 'Loading shared progress…';
  else if (s === 'error') el.textContent = 'Shared progress is offline. Saving paused.';
  else if (state.mode === 'shared') el.innerHTML = '<b>●</b> Shared with the team';
  else el.textContent = 'Saving on this device only';
}

// ---------- utils ----------
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(9).forEach(c => { if (c == null || c === false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function uniq(a){ return [...new Set(a)]; }
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function go(view){ state.view = view; render(); window.scrollTo({top:0}); }
function daysLeft(){ const d = Math.ceil((SHOW_DATE - Date.now()) / 86400000); return d; }
function ago(ts){ if (!ts) return 'never'; const m = Math.round((Date.now() - ts) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const hrs = Math.round(m / 60); if (hrs < 24) return hrs + ' h ago'; return Math.round(hrs / 24) + ' d ago'; }

function readiness(seatId){
  const st = seat(seatId), keys = checklist(st);
  let r3 = 0, r2 = 0, words = 0, ok = 0;
  keys.forEach(k => { const it = item(seatId, k); if (it.r === 3) r3++; else if (it.r === 2) r2++; if (it.w && it.w.trim().length > 8) words++; if (it.ok) ok++; });
  const pct = Math.round(100 * (r3 + 0.5 * r2) / keys.length);
  return {total:keys.length, r3, r2, words, ok, pct};
}
function status(pct){ return pct >= 80 ? ['ready','Ready'] : pct >= 45 ? ['close','Getting close'] : ['early','Early days']; }

function selfBlock(st, key, sample, prompt){
  if (!st) return null;
  const it = item(st.id, key);
  const draftKey = st.id + '|' + key;
  const ta = h('textarea', {id:'w-' + key, placeholder:prompt || 'Explain it like you will to the judges…', rows:'3'});
  ta.value = state.drafts[draftKey] != null ? state.drafts[draftKey] : (it.w || '');
  let t;
  const flush = () => { clearTimeout(t); const val = ta.value; if (val === (item(st.id, key).w || '')) return; saveItem(st.id, key, {w:val, ok:false}); delete state.drafts[draftKey]; };
  ta.addEventListener('input', () => { state.drafts[draftKey] = ta.value; clearTimeout(t); t = setTimeout(flush, 900); });
  ta.addEventListener('blur', flush);
  const sampleEl = sample ? h('details', null, h('summary', {class:'small'}, 'Stuck? See a sample sentence'), h('p', {class:'sample'}, '“' + sample + '”', h('br'), h('span', {class:'small'}, 'Now say it with your own words.'))) : null;
  const rate = h('div', {class:'rate', role:'group', 'aria-label':'How well can you explain it?'},
    [1, 2, 3].map(n => h('button', {type:'button', class:'r' + n, 'aria-pressed':String(it.r === n), onclick:() => { saveItem(st.id, key, {r:n}); render(); }}, RATE[n])));
  return h('div', {class:'note'},
    h('label', {for:'w-' + key}, 'In my own words'),
    ta, sampleEl,
    h('div', {class:'row'}, rate, it.ok ? h('span', {class:'ok'}, '✓ Checked by trainer') : null),
    it.n ? h('p', {class:'tnote'}, 'Trainer: ' + it.n) : null);
}

// ---------- quiz ----------
function opts(correct, pool, n){
  const d = shuffle(uniq(pool.filter(x => x && x !== correct))).slice(0, (n || 4) - 1);
  return shuffle(d.concat([correct]));
}
function makeQuiz(st){
  const games = seatGames(st);
  const allVars = [], allSprites = [], allScenes = [];
  games.concat(['shared']).forEach(g => { proj(g).variables.forEach(v => allVars.push({g, v})); proj(g).sprites.forEach(s => allSprites.push({g, s})); });
  games.forEach(g => proj(g).scenes.forEach((s, i) => allScenes.push({g, s, i})));
  const gens = {
    why(){ const {g, v} = pick(allVars); const pool = proj(g).variables.map(x => x.name).concat(allVars.map(x => x.v.name));
      return {q:'Which variable is this? “' + v.why + '”', a:v.name, o:opts(v.name, pool), k:vkey(g, v), g}; },
    times(){ const {g, v} = pick(allVars.filter(x => x.v.times)); const pool = allVars.map(x => x.v.times);
      return {q:'How many times can ' + v.name + ' change?', a:v.times, o:opts(v.times, pool), k:vkey(g, v), g}; },
    changes(){ const {g, v} = pick(allVars); const pool = proj(g).variables.map(x => x.changes).concat(allVars.map(x => x.v.changes));
      return {q:'What changes ' + v.name + '?', a:v.changes, o:opts(v.changes, pool), k:vkey(g, v), g}; },
    effect(){ const {g, v} = pick(allVars); const pool = proj(g).variables.map(x => x.effect).concat(allVars.map(x => x.v.effect));
      return {q:'When ' + v.name + ' changes, what happens?', a:v.effect, o:opts(v.effect, pool), k:vkey(g, v), g}; },
    kind(){ const {g, v} = pick(allVars); const ks = Object.keys(KIND);
      return {q:'What type of variable is ' + v.name + '?', a:KIND[v.kind], o:opts(KIND[v.kind], ks.map(k => KIND[k])), k:vkey(g, v), g}; },
    rename(){ const withOld = allVars.filter(x => x.v.old); if (!withOld.length) return gens.why(); const {g, v} = pick(withOld);
      return {q:'In v2 it was called “' + v.old + '”. What is its clear v2.1 name?', a:v.name, o:opts(v.name, allVars.map(x => x.v.name)), k:vkey(g, v), g}; },
    count(){ const g = pick(games), n = proj(g).scenes.length; const o = shuffle(uniq([n, n - 1, n + 1, n + 2].filter(x => x > 2))).slice(0, 4).map(String);
      return {q:'How many scenes does ' + title(g) + ' have?', a:String(n), o:o.includes(String(n)) ? o : shuffle(o.slice(0, 3).concat([String(n)])), k:sckey(g), g}; },
    trigger(){ const {g, s} = pick(allScenes); const pool = proj(g).scenes.map(x => x.trigger);
      return {q:'In ' + title(g) + ', what starts the scene “' + s.name + '”?', a:s.trigger, o:opts(s.trigger, pool), k:sckey(g), g}; },
    after(){ const c = allScenes.filter(x => x.i < proj(x.g).scenes.length - 1); const {g, s, i} = pick(c); const nx = proj(g).scenes[i + 1].name;
      return {q:'In ' + title(g) + ', which scene comes right after “' + s.name + '”?', a:nx, o:opts(nx, proj(g).scenes.map(x => x.name).filter(x => x !== s.name)), k:sckey(g), g}; },
    animates(){ const {g, s} = pick(allSprites); const pool = allSprites.map(x => x.s.animates);
      return {q:'How does ' + s.name + ' animate?', a:s.animates, o:opts(s.animates, pool), k:skey(g, s), g}; },
    clones(){ const cl = allSprites.filter(x => !/^no clones/i.test(x.s.clones)); const nc = allSprites.filter(x => /^no clones/i.test(x.s.clones));
      if (!cl.length || nc.length < 3) return gens.animates(); const {g, s} = pick(cl);
      return {q:'Which of these sprites makes clones?', a:s.name, o:shuffle(shuffle(nc).slice(0, 3).map(x => x.s.name).concat([s.name])), k:skey(g, s), g, why:s.name + ': ' + s.clones}; },
  };
  const plan = st.role === 'vars'
    ? ['why', 'why', 'times', 'times', 'changes', 'effect', 'effect', 'kind', 'rename', 'count']
    : ['count', 'count', 'trigger', 'trigger', 'after', 'animates', 'animates', 'clones', 'clones', 'why'];
  const qs = []; const seen = new Set();
  shuffle(plan).forEach(t => { let q, tries = 0; do { q = gens[t](); tries++; } while (seen.has(q.q) && tries < 8); seen.add(q.q); qs.push(q); });
  return {qs, i:0, score:0, marks:[], picked:null, missed:[]};
}
function viewQuiz(v){
  const st = seat(state.me), Q = v.q;
  if (Q.i >= Q.qs.length) return quizDone(st, Q);
  const q = Q.qs[Q.i];
  const answered = Q.picked != null;
  return h('div', {class:'stack', style:'gap:18px'},
    h('button', {class:'back', type:'button', onclick:() => go({name:'plan'})}, '← Stop quiz'),
    h('div', {class:'progress', 'aria-hidden':'true'}, Q.qs.map((_, i) => h('i', {class:i < Q.i ? (Q.marks[i] ? 'r' : 'w') : i === Q.i ? 'c' : ''}))),
    h('div', {class:'qcard'},
      h('p', {class:'tagline'}, 'Question ' + (Q.i + 1) + ' of ' + Q.qs.length + ' · ' + title(q.g)),
      h('p', {class:'qtext'}, q.q),
      h('div', {class:'opts'}, q.o.map(o => h('button', {class:'opt' + (answered && o === q.a ? ' right' : '') + (answered && o === Q.picked && o !== q.a ? ' wrong' : ''), type:'button', disabled:answered || null,
        onclick:() => { Q.picked = o; const ok = o === q.a; Q.marks.push(ok); if (ok) Q.score++; else Q.missed.push(q.k); render(); }}, o))),
      answered ? h('div', {class:'row'},
        h('p', {class:'grow', style:'font-weight:700;color:var(' + (Q.picked === q.a ? '--good' : '--bad') + ')'}, Q.picked === q.a ? 'Right!' : 'Not quite. The answer is highlighted in green.'),
        h('button', {class:'btn primary', type:'button', onclick:() => { Q.i++; Q.picked = null; render(); }}, Q.i + 1 < Q.qs.length ? 'Next question' : 'See my score')) : null));
}
function quizDone(st, Q){
  if (!Q.saved){
    Q.saved = true;
    const old = prog(st.id).quiz || {};
    writeProgress(st.id, {quiz:{best:Math.max(old.best || 0, Q.score), last:Q.score, tries:(old.tries || 0) + 1, missed:uniq(Q.missed), at:Date.now()}});
  }
  const msg = Q.score >= 9 ? 'Judge-ready.' : Q.score >= 7 ? 'Strong. Fix the misses and go again.' : Q.score >= 5 ? 'Halfway there. Study the misses, then retry.' : 'Back to Study for these, then try again.';
  return h('div', {class:'stack', style:'gap:18px'},
    h('div', {class:'qcard'},
      h('p', {class:'tagline'}, 'Quiz finished'),
      h('p', {class:'big'}, Q.score + '/10'),
      h('p', {class:'qtext'}, msg),
      Q.missed.length ? h('div', {class:'stack', style:'gap:8px'}, h('p', {class:'small muted'}, 'Study these again:'),
        h('div', {class:'row'}, uniq(Q.missed).map(k => { const [pid, kind] = k.split('__'); return h('button', {class:'btn sm', type:'button', onclick:() => go({name:'study', pid, tab:kind === 'v' ? 'vars' : kind === 'scenes' ? 'scenes' : 'sprites', focus:k})}, labelFor(k)); }))) : null,
      h('div', {class:'row'},
        h('button', {class:'btn primary', type:'button', onclick:() => go({name:'quiz', q:makeQuiz(st)})}, 'New quiz'),
        h('button', {class:'btn', type:'button', onclick:() => go({name:'plan'})}, 'Back to my plan'))));
}

// ---------- judge practice ----------
const GENERAL = {
  vars:[
    {q:'What is the difference between a variable “for all sprites” and one “for this sprite only”?', a:['A “for all sprites” variable is one value every sprite can read, like Score.', 'A “for this sprite only” variable belongs to one sprite. Every clone gets its own copy, so each clone can remember its own number, like My Heart or My Food.']},
    {q:'Why did you rename short variables like i, k or TX?', a:['Short names only make sense to the person who wrote them.', 'Clear names like Food Number or Target X make the code read like English, so a judge or a new teammate can follow it. We also added a yellow note to every sprite.']},
    {q:'What is a rule number, and why are they at the top of the Stage?', a:['A rule number is a setting we choose before the game, like the price or the time limit.', 'They are all set in one place when the green flag is clicked, so we can change the game by changing one number. They never change during play.']},
    {q:'What does “broadcast” do, and how is it different from “broadcast and wait”?', a:['Broadcast sends a message to every sprite and carries on straight away.', 'Broadcast and wait sends the message and waits until every script that heard it has finished. We use plain broadcast when a listener runs forever, like a number display, or the game would wait for ever.']},
  ],
  sprites:[
    {q:'What is a clone, and how does a clone know which one it is?', a:['A clone is a copy of a sprite made while the game runs.', 'Before making it, the original sets a “for this sprite only” variable, like My Answer or My Food. The clone keeps its own copy, so each clone knows its number. Is Clone = 1 stops clones making more clones.']},
    {q:'How do you make movement look smooth instead of jumpy?', a:['We use easing: each frame the sprite moves part of the distance that is left, so it slows down as it arrives.', 'We also switch costumes (flipbook) for legs and wheels, and use the ghost effect to fade in and out.']},
    {q:'Who controls the scenes in your game?', a:['The Stage is the director. A click or a message starts each scene.', 'The Stage changes the backdrop and broadcasts a message. Every sprite has a “when I receive” script that shows, hides or moves it for that scene.']},
    {q:'How do your big numbers show ₦ and commas without flickering?', a:['Each number display draws one clone per character, using the Glyphs list for costumes.', 'It redraws inside a custom block that runs without screen refresh, so you never see half a number. Old digits delete themselves using Drawing Number.']},
  ],
};
function makeJudge(st){
  const games = seatGames(st);
  const out = [];
  if (st.role === 'vars'){
    games.concat(['shared']).forEach(g => proj(g).variables.forEach(v => {
      const k = vkey(g, v);
      out.push({g, k, q:'Why did you create ' + v.name + '?', a:[v.why, 'It starts at ' + v.start + '.'], say:v.say});
      out.push({g, k, q:'When does ' + v.name + ' change, and what happens on screen when it does?', a:['What changes it: ' + v.changes, 'When: ' + v.when, 'Then: ' + v.effect], say:v.say});
      out.push({g, k, q:'How many times can ' + v.name + ' change in one game?', a:[v.times, 'What changes it: ' + v.changes], say:v.say});
      if (v.old) out.push({g, k, q:'In the older version ' + v.name + ' was called “' + v.old + '”. Why rename it, and what does it do?', a:['A clear name tells everyone what it holds. ' + v.why, 'Then: ' + v.effect], say:v.say});
    }));
  } else {
    games.forEach(g => {
      const P = proj(g);
      out.push({g, k:sckey(g), q:'How many scenes does ' + title(g) + ' have, and what starts each one?', a:[P.scenes.length + ' scenes.'].concat(P.scenes.map(s => s.n + '. ' + s.name + ': starts when ' + s.trigger + '; ends when ' + s.ends + '.'))});
      const pickS = shuffle(P.scenes).slice(0, 3);
      pickS.forEach(s => out.push({g, k:sckey(g), q:'Walk me through the “' + s.name + '” scene of ' + title(g) + '.', a:['Starts when: ' + s.trigger, 'Backdrop: ' + s.backdrop, 'What happens: ' + s.shows, 'Ends when: ' + s.ends]}));
      P.sprites.forEach(s => {
        out.push({g, k:skey(g, s), q:'How does ' + s.name + ' move or animate?', a:[s.animates, 'Costumes: ' + s.costumes, s.cool]});
        if (!/^no clones/i.test(s.clones)) out.push({g, k:skey(g, s), q:'Does ' + s.name + ' use clones? How?', a:[s.clones, s.cool]});
      });
    });
  }
  GENERAL[st.role].forEach(x => out.push({g:'shared', k:null, q:x.q, a:x.a}));
  return Object.assign({}, pick(out));
}
let judgeTimer = null;
function viewJudge(v){
  clearInterval(judgeTimer);
  const st = seat(state.me), q = v.q;
  const lim = 60;
  const head = h('div', {class:'row'},
    h('button', {class:'back grow', type:'button', onclick:() => { clearInterval(judgeTimer); go({name:'plan'}); }}, '← Stop practice'),
    h('span', {class:'small muted'}, 'Question ' + v.n + ' this session'));
  const card = h('div', {class:'qcard'},
    h('p', {class:'judge-tag'}, 'A judge asks · ' + title(q.g)),
    h('p', {class:'qtext'}, q.q));
  if (v.phase === 'ask'){
    const bar = h('i', {style:'width:100%'}), num = h('b', null, String(lim));
    card.append(h('p', {class:'small muted'}, 'Answer out loud or in sign, as if the judge is standing in front of you. Then check.'),
      h('div', {class:'timer', role:'timer', 'aria-label':'60 second timer'}, h('div', {class:'bar2'}, bar), num),
      h('div', {class:'row'},
        h('button', {class:'btn primary', type:'button', onclick:() => { clearInterval(judgeTimer); v.phase = 'check'; render(); }}, 'Check my answer'),
        h('button', {class:'btn', type:'button', onclick:() => go({name:'judge', q:makeJudge(st), n:v.n, phase:'ask'})}, 'Different question')));
    const t0 = Date.now();
    judgeTimer = setInterval(() => {
      if (!document.body.contains(bar)) { clearInterval(judgeTimer); return; }
      const left = Math.max(0, lim - (Date.now() - t0) / 1000);
      bar.style.width = (100 * left / lim) + '%'; bar.classList.toggle('low', left < 15); num.textContent = Math.ceil(left);
      if (left <= 0){ clearInterval(judgeTimer); v.phase = 'check'; v.timeout = true; render(); }
    }, 250);
  } else {
    const rec = (r) => {
      const old = prog(st.id).rehearse || {};
      const log = (old.log || []).concat([{q:q.q, r, at:Date.now()}]).slice(-25);
      writeProgress(st.id, {rehearse:{count:(old.count || 0) + 1, at:Date.now(), log}});
      if (q.k){ const it = item(st.id, q.k); if (r === 'nailed' && !(it.r >= 2)) saveItem(st.id, q.k, {r:2}); if (r === 'missed' && it.r === 3) saveItem(st.id, q.k, {r:2}); }
      go({name:'judge', q:makeJudge(st), n:v.n + 1, phase:'ask'});
    };
    card.append(...[
      v.timeout ? h('p', {class:'small', style:'color:var(--warn);font-weight:700'}, 'Time is up. Judges usually give about a minute.') : null,
      h('div', {class:'answer'}, h('p', {class:'tagline'}, 'A full answer covers'), q.a.map(x => h('p', null, x)),
        q.say ? h('p', {class:'sample'}, 'Short version: “' + q.say + '”') : null),
      h('p', {style:'font-weight:700'}, 'How did you do?'),
      h('div', {class:'row'},
        h('button', {class:'btn', type:'button', onclick:() => rec('missed')}, 'Missed it'),
        h('button', {class:'btn', type:'button', onclick:() => rec('partly')}, 'Partly'),
        h('button', {class:'btn primary', type:'button', onclick:() => rec('nailed')}, 'Nailed it')),
      q.k ? h('button', {class:'btn sm ghost', type:'button', onclick:() => { const [pid, kind] = q.k.split('__'); go({name:'study', pid, tab:kind === 'v' ? 'vars' : kind === 'scenes' ? 'scenes' : 'sprites', focus:q.k}); }}, 'Open this in Study') : null].filter(Boolean));
  }
  return h('div', {class:'stack', style:'gap:18px'}, head, card);
}

// ---------- trainer ----------
function viewTrainer(){
  const rows = SEATS.map(st => {
    const r = readiness(st.id), p = prog(st.id), [cls, lab] = status(r.pct);
    return h('tr', null,
      h('td', null, h('b', null, seatName(st.id) || '(no name yet)'), h('br'), h('span', {class:'small muted'}, school(st.school).name)),
      h('td', null, ROLES[st.role].short),
      h('td', null, h('span', {class:'pill ' + cls}, lab), ' ', h('span', {class:'num'}, r.pct + '%')),
      h('td', {class:'num'}, r.r3 + '/' + r.total),
      h('td', {class:'num'}, r.words + (r.ok ? ' (' + r.ok + ' ✓)' : '')),
      h('td', {class:'num'}, p.quiz ? p.quiz.best + '/10 best · ' + p.quiz.tries + ' tries' : '–'),
      h('td', {class:'num'}, (p.rehearse && p.rehearse.count) || 0),
      h('td', {class:'small muted'}, ago(p.updatedAt)),
      h('td', null, h('button', {class:'btn sm', type:'button', onclick:() => go({name:'review', seat:st.id})}, 'Read answers')));
  });
  const anyData = SEATS.some(st => state.progress[st.id]);
  return h('div', {class:'stack', style:'gap:20px'},
    h('button', {class:'back', type:'button', onclick:() => go({name:'seats'})}, '← All seats'),
    h('h1', null, 'Trainer board'),
    h('p', {class:'lede'}, 'Ready means at least 80% of a speaker’s list is rated “I can explain it” (“Getting there” counts half). Read their own-words answers and tick the ones you would accept from a judge’s point of view.'),
    anyData ? null : h('p', {class:'empty'}, 'No practice saved yet. When a speaker picks a seat and rates their first variable, sprite or scene, their row fills in here.'),
    h('div', {class:'tbl'}, h('table', null,
      h('thead', null, h('tr', null, ['Speaker', 'Role', 'Readiness', 'Explained', 'Own words', 'Quiz', 'Judge practice', 'Last active', ''].map(t => h('th', null, t)))),
      h('tbody', null, rows))),
    state.mode === 'local' ? h('p', {class:'small muted'}, 'This page cannot reach shared storage right now, so it only shows practice saved on this device.') : null);
}
function viewReview(v){
  const st = seat(v.seat), p = prog(st.id), keys = checklist(st);
  const written = keys.filter(k => (item(st.id, k).w || '').trim());
  const canMark = state.isTrainer;
  const log = (p.rehearse && p.rehearse.log) || [];
  return h('div', {class:'stack', style:'gap:18px'},
    h('button', {class:'back', type:'button', onclick:() => go({name:'trainer'})}, '← Trainer board'),
    h('h1', null, (seatName(st.id) || ROLES[st.role].short) + ' · ' + school(st.school).name),
    h('p', {class:'lede'}, written.length + ' own-words answers out of ' + keys.length + ' items. ' + (canMark ? 'Tick an answer you would accept, or leave a short note. The speaker sees both.' : 'Only the trainer can tick answers.')),
    written.length ? null : h('p', {class:'empty'}, 'Nothing written yet. Answers appear here as soon as the speaker types in a yellow “In my own words” note.'),
    h('div', {class:'review'}, written.map(k => {
      const it = item(st.id, k);
      const noteIn = h('input', {type:'text', id:'n-' + k, placeholder:'Short note for the speaker', value:it.n || '', onchange:e => saveItem(st.id, k, {n:e.target.value.trim()})});
      return h('div', {class:'rv'},
        h('div', {class:'row'}, h('b', {class:'grow'}, labelFor(k)), it.r ? h('span', {class:'small muted'}, 'Self-rated: ' + RATE[it.r]) : null),
        h('blockquote', null, it.w),
        canMark ? h('div', {class:'row'},
          h('button', {class:'btn sm' + (it.ok ? ' primary' : ''), type:'button', 'aria-pressed':String(!!it.ok), onclick:() => { saveItem(st.id, k, {ok:!it.ok}); render(); }}, it.ok ? '✓ Accepted' : 'Accept'),
          h('div', {class:'grow'}, noteIn)) : (it.ok ? h('span', {class:'ok'}, '✓ Accepted') : null));
    })),
    log.length ? h('div', {class:'card'}, h('h3', null, 'Recent judge practice'),
      log.slice().reverse().slice(0, 10).map(x => h('p', {class:'small'}, h('b', null, x.r === 'nailed' ? 'Nailed it' : x.r === 'partly' ? 'Partly' : 'Missed it'), ' · ', x.q, h('span', {class:'muted'}, ' · ' + ago(x.at))))) : null);
}
