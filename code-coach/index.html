<title>Showcase Code Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column workbench. Top bar = who is practising; body = the current screen (seats, plan, study, quiz, judge, trainer). */
:root{
  --bg:#EEF3EE; --surface:#FFFFFF; --sunk:#E3EBE4; --ink:#14221A; --muted:#55665B; --line:#CFDACF;
  --accent:#0A7A4A; --accent-ink:#FFFFFF; --accent-soft:#D5EEDF;
  --var:#E06B00; --var-ink:#FFFFFF;
  --note:#FFF1A8; --note-line:#E6CF55; --note-ink:#3B3206;
  --good:#1E8A4C; --warn:#B86A00; --bad:#C2382B;
  --k-rule:#3F6EA8; --k-counter:#8A4FBF; --k-switch:#0F8A8A; --k-memory:#A0567A; --k-helper:#6B7A2E; --k-list:#B5562A; --k-message:#4F5FBF;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#16211A; --sunk:#1D2A21; --ink:#E4EEE7; --muted:#9DB0A3; --line:#2C3D31;
  --accent:#3CC488; --accent-ink:#06210F; --accent-soft:#173D29;
  --var:#FF9A3D; --var-ink:#2A1400;
  --note:#3A3315; --note-line:#6E6024; --note-ink:#FBEFB7;
  --good:#4FD08A; --warn:#F0A43A; --bad:#FF7A6B;
  --k-rule:#86AEE6; --k-counter:#C59BEB; --k-switch:#5FD1D1; --k-memory:#E39BC0; --k-helper:#B9C96F; --k-list:#F09A6F; --k-message:#9AA6F2;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --sunk:#1D2A21; --ink:#E4EEE7; --muted:#9DB0A3; --line:#2C3D31;
  --accent:#3CC488; --accent-ink:#06210F; --accent-soft:#173D29;
  --var:#FF9A3D; --var-ink:#2A1400;
  --note:#3A3315; --note-line:#6E6024; --note-ink:#FBEFB7;
  --good:#4FD08A; --warn:#F0A43A; --bad:#FF7A6B;
  --k-rule:#86AEE6; --k-counter:#C59BEB; --k-switch:#5FD1D1; --k-memory:#E39BC0; --k-helper:#B9C96F; --k-list:#F09A6F; --k-message:#9AA6F2;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,40px);font-weight:800}
h2{font-size:clamp(22px,3.6vw,28px);font-weight:700}
h3{font-size:20px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.bar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand .blk{width:26px;height:20px;background:var(--var);border-radius:6px 6px 6px 6px;position:relative}
.brand .blk::after{content:"";position:absolute;left:6px;top:-4px;width:10px;height:6px;background:var(--var);border-radius:3px 3px 0 0}
.seatchip{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:15px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--accent-ink);background:var(--accent)}
.sync{font-size:13px;color:var(--muted);margin-left:auto}
.sync b{color:var(--good)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:15px;border-radius:10px}
.back{align-self:flex-start;text-align:left;background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700}
.back:hover{color:var(--ink)}

main{padding-top:22px}
.lede{max-width:62ch;color:var(--muted)}

/* seat picker */
.schools{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.school{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.school h3{font-size:19px}
.seat{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--sunk);border:2px solid transparent;border-radius:12px;padding:12px}
.seat:hover{border-color:var(--accent)}
.seat .role{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.seat .nm{font-family:var(--display);font-size:20px;font-weight:700}
.meter{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.badge-star{color:var(--var);font-weight:700}

/* plan */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.mode:hover{border-color:var(--accent)}
.mode .k{font-family:var(--display);font-size:21px;font-weight:700}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.game:hover{border-color:var(--accent)}
.game .t{font-family:var(--display);font-weight:700;font-size:19px}
.facts{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-variant-numeric:tabular-nums}
.tagline{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}

/* study */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.switch{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.done{border-color:var(--good)}
.vhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vpill{font-family:var(--mono);font-weight:700;font-size:15px;background:var(--var);color:var(--var-ink);padding:5px 12px;border-radius:999px;word-break:break-word}
.kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;border:1.5px solid currentColor}
.k-rule{color:var(--k-rule)}.k-counter{color:var(--k-counter)}.k-switch{color:var(--k-switch)}.k-memory{color:var(--k-memory)}.k-helper{color:var(--k-helper)}.k-list{color:var(--k-list)}.k-message{color:var(--k-message)}
.was{font-size:14px;color:var(--muted)}
.was code{font-family:var(--mono);text-decoration:line-through}
.qa{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:8px 16px}
@media (max-width:560px){.qa{grid-template-columns:1fr;gap:2px}.qa dd{margin-bottom:8px}}
.qa dt{font-weight:700;font-size:15px;color:var(--muted)}
.qa dd{margin:0;min-width:0}
.cover{background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:2px 10px;color:var(--muted);font-size:15px;text-align:left;width:100%}
.note{background:var(--note);border:1px solid var(--note-line);color:var(--note-ink);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 0 var(--note-line)}
.note label{font-weight:700;font-size:15px}
.note textarea{width:100%;min-height:76px;resize:vertical;border:0;background:transparent;color:var(--note-ink);font:inherit;line-height:1.45;padding:0}
.note textarea::placeholder{color:color-mix(in srgb,var(--note-ink) 55%,transparent)}
.sample{font-style:italic;font-size:15px}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700}
.rate button[aria-pressed="true"].r1{background:var(--bad);border-color:var(--bad);color:#fff}
.rate button[aria-pressed="true"].r2{background:var(--warn);border-color:var(--warn);color:#fff}
.rate button[aria-pressed="true"].r3{background:var(--good);border-color:var(--good);color:#fff}
.ok{font-size:14px;font-weight:700;color:var(--good)}
.tnote{font-size:14px;border-left:3px solid var(--accent);padding-left:10px}
.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.scene{display:grid;grid-template-columns:44px 1fr;gap:12px;padding-bottom:14px;position:relative}
.scene::before{content:"";position:absolute;left:21px;top:40px;bottom:0;width:2px;background:var(--line)}
.scene:last-child::before{display:none}
.scene .n{width:44px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.scene .body{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
.scene .when{font-size:14px;color:var(--muted)}
.scene .when b{color:var(--ink)}
.trick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.trick div{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:15px}
.trick b{display:block;font-family:var(--display);font-size:17px}

/* quiz / judge */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.qtext{font-family:var(--display);font-size:clamp(21px,3.4vw,26px);font-weight:700;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.r{background:var(--good)}.progress i.w{background:var(--bad)}.progress i.c{background:var(--accent)}
.big{font-family:var(--display);font-size:56px;font-weight:800;line-height:1}
.timer{display:flex;align-items:center;gap:14px}
.timer .bar2{flex:1;height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.timer .bar2 i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.timer .bar2 i.low{background:var(--warn)}
.timer b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.answer{background:var(--sunk);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.judge-tag{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--var)}

/* trainer */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;white-space:nowrap;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.ready{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.close{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.early{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.review{display:flex;flex-direction:column;gap:12px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rv blockquote{margin:0;background:var(--note);color:var(--note-ink);border-radius:6px;padding:10px 12px}
.rv input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="bar"><div class="wrap">
  <button class="brand" id="home" type="button"><span class="blk" aria-hidden="true"></span>Showcase Code Coach</button>
  <span id="who"></span>
  <span class="sync" id="sync">Connecting…</span>
</div></header>
<main class="wrap" id="app"></main>

<script type="application/json" id="kb">{"shared":{"title":"Shared parts of every v2 game","variables":[{"name":"Game On","kind":"switch","start":"0","why":"Tells every sprite that the game (the playing part) is running.","changes":"The Stage sets it to 1 when play starts and to 0 when play ends.","when":"At the start and end of play.","effect":"Loops that run \"repeat until Game On = 0\" stop, and clicks are ignored when it is 0.","times":"Twice per game.","say":"Game On is the \"we are playing\" switch. Clicks only count while it is 1.","scope":"all"},{"name":"Caption","kind":"message","start":"(empty)","why":"Holds the NAME of the big sentence to show.","changes":"The Stage (and some sprites) set it, then broadcast \"caption\".","when":"Whenever a new sentence should appear.","effect":"The Caption sprite switches to the costume with that name. The word \"none\" hides it.","times":"Many times per game.","say":"Caption holds the name of the sentence; the Caption sprite reads it and switches costume.","scope":"all"},{"name":"Mine","kind":"memory","start":"(empty)","why":"The caption remembers which sentence it is showing, so a short \"flash\" caption only hides itself if no newer one came.","changes":"The Caption sprite copies Caption into Mine.","when":"Each flash caption.","effect":"A newer caption is never hidden by an older timer.","times":"Per caption.","say":"Mine stops an old caption from hiding a new one.","scope":"Caption"},{"name":"Game Stars","kind":"switch","start":"0","why":"Remembers if you met the game goal (1) or not (0).","changes":"The Stage sets it just before the lesson.","when":"Once, at the end of play.","effect":"It is added to the quiz score to make your stars.","times":"Once per game.","say":"Game Stars is 1 if you won the game. It gives you your first star.","scope":"all"},{"name":"Lesson On","kind":"switch","start":"0","why":"Makes sure QUICK QUIZ only works while the lesson card is showing.","changes":"The Lesson Card sets it to 1; the Continue Button sets it to 0 when clicked.","when":"When the lesson appears and when the quiz starts.","effect":"A second click on QUICK QUIZ does nothing, so the quiz cannot start twice.","times":"Twice per game.","say":"Lesson On stops the quiz from starting twice.","scope":"all"},{"name":"Quiz Q","kind":"counter","start":"0","why":"Which quiz question we are on.","changes":"The Lesson Card changes it by 1 on \"quiz next\".","when":"After the lesson and after every answer.","effect":"The Lesson Card shows costume q + Quiz Q; when it is bigger than the number of questions, the stars come.","times":"2 or 3 times (once per question), plus 1 to finish.","say":"Quiz Q counts the questions.","scope":"all"},{"name":"Quiz Score","kind":"counter","start":"0","why":"How many quiz answers were right.","changes":"The Answer clone changes it by 1 for a right answer.","when":"Each right answer.","effect":"It is added to Game Stars to make the stars.","times":"Up to the number of questions.","say":"Quiz Score counts my right answers.","scope":"all"},{"name":"Answer Locked","kind":"switch","start":"0","why":"Stops a second answer being clicked for the same question.","changes":"Set to 0 when a question appears; set to 1 when an answer is clicked.","when":"Once per question.","effect":"Other answers ignore clicks while it is 1.","times":"Twice per question.","say":"Answer Locked means you only get one try.","scope":"all"},{"name":"Stars","kind":"memory","start":"0","why":"How many stars you earned (0 to 3).","changes":"The Stars sprite sets it to Game Stars + Quiz Score, then 3 if it is more.","when":"Once, after the quiz.","effect":"That many stars pop in.","times":"Once per game.","say":"Stars is my final score out of 3.","scope":"all"},{"name":"Star Count","kind":"counter","start":"0","why":"Counts the stars as they pop in one by one.","changes":"The Stars sprite changes it by 1 in a loop.","when":"During the star animation.","effect":"The Stars sprite switches to costume (Star Count + 1).","times":"Up to 3 times.","say":"Star Count is how many stars have popped in so far.","scope":"Stars"},{"name":"My Answer","kind":"memory","start":"0","why":"Each answer clone remembers if it is answer A (1), B (2) or C (3).","changes":"The original Answer sprite changes it by 1 and makes a clone, 3 times.","when":"When a question appears.","effect":"The clone wears costume q + Quiz Q + a + My Answer and checks it against the Quiz Correct list.","times":"3 times per question in the original; never in a clone.","say":"My Answer tells each answer box which letter it is.","scope":"Answer"},{"name":"Quiz Correct","kind":"list","start":"the right letter number for each question","why":"The right answer (1, 2 or 3) for each question.","changes":"Never changes; filled when the project is made.","when":"Only read.","effect":"A click is right if My Answer = item Quiz Q of Quiz Correct.","times":"Never.","say":"Quiz Correct is the answer key.","scope":"all"},{"name":"Glyphs, Glyph Width","kind":"list","start":"0–9 ₦ , % / k g space - x : .","why":"The characters our number displays can draw, and how wide each one is.","changes":"Never change.","when":"Only read.","effect":"A number display finds a character in Glyphs to choose its costume, and uses Glyph Width to place the next one.","times":"Never.","say":"These lists are the alphabet and the spacing of our number displays.","scope":"all"},{"name":"Text To Show","kind":"memory","start":"(empty)","why":"What the number should look like now, with ₦ and commas.","changes":"The display's loop rebuilds it every 0.05 seconds.","when":"All the time while the display is on.","effect":"If it is different from Text On Screen, the number is redrawn.","times":"About 20 times a second (only redraws when it changes).","say":"Text To Show is what the number should say.","scope":"every number display"},{"name":"Text On Screen","kind":"memory","start":"#","why":"What is drawn on screen right now.","changes":"Set to Text To Show just before redrawing.","when":"When the number changes.","effect":"Stops the display redrawing when nothing changed.","times":"Once per change.","say":"Text On Screen is what is drawn now.","scope":"every number display"},{"name":"Drawing Number, My Drawing Number","kind":"counter","start":"0","why":"Every new drawing gets a new number; each digit clone remembers which drawing it belongs to.","changes":"The display changes Drawing Number by 1 for each new drawing; each clone copies it into My Drawing Number.","when":"Each redraw and each hide.","effect":"Clones whose My Drawing Number is older delete themselves, so old digits never stay on screen.","times":"Once per change of the number.","say":"Drawing Number makes old digits disappear when a new number is drawn.","scope":"every number display"},{"name":"Plain Number, With Commas, Digit Position, Digits Counted","kind":"helper","start":"0","why":"Used only to add commas to money: 12500 becomes ₦12,500.","changes":"A loop reads the digits from the right and adds a comma after every 3.","when":"Each time the money value is read.","effect":"Text To Show gets the commas and the ₦ sign.","times":"Many times (inside the comma loop).","say":"These helpers put the commas into money.","scope":"money displays"},{"name":"Letter Number, My Character, Next X, My X, Display On, Is Clone","kind":"helper","start":"0","why":"Used while drawing: which letter, which character, where the next one goes, and if this sprite is a clone.","changes":"Inside the \"draw the number\" custom block.","when":"During a redraw.","effect":"One clone per character appears in the right place.","times":"Once per character.","say":"These helpers place each digit.","scope":"every number display"},{"name":"Is Clone","kind":"switch","start":"0","why":"Lets a sprite know if it is the original (0) or a clone (1).","changes":"Each new clone sets it to 1 as its first block.","when":"Once, when a clone is born.","effect":"Scripts like \"if Is Clone = 0 then make clones\" only run in the original, so clones never make clones of themselves by mistake.","times":"Once per clone.","say":"Is Clone stops clones from copying themselves again and again.","scope":"sprites that clone"}],"sprites":[{"name":"Title","costumes":"title","animates":"Starts 40 steps higher at 90% size and invisible (ghost 100), fades in over 6 frames and eases down to its place.","clones":"No clones.","cool":"Easing: each frame it moves 20% of the distance left, so it slows down as it arrives."},{"name":"Play Button, Help Button","costumes":"play, again / help","animates":"Show and hide on broadcasts. PLAY becomes PLAY AGAIN at the end.","clones":"No clones.","cool":"PLAY only sends \"start game\"; every sprite gets ready by itself."},{"name":"Help Card","costumes":"help","animates":"Shows on \"show help\".","clones":"No clones.","cool":"The text size is worked out from the longest line, so every line fits."},{"name":"HUD Bar","costumes":"bar","animates":"Shows on \"hud on\", hides on \"hud off\".","clones":"No clones.","cool":"Only the labels are drawn on it. The numbers are separate sprites on top."},{"name":"Number displays","costumes":"g1 … g21 (one per character)","animates":"Redraws the whole number at once when it changes.","clones":"One clone per character (₦12,500 = 7 clones).","cool":"Runs without screen refresh, so you never see half a number."},{"name":"Caption","costumes":"one per sentence","animates":"Switches to the costume named in Caption and shows.","clones":"No clones.","cool":"Every sentence is a picture, so Deaf players can read everything."},{"name":"Lesson Card","costumes":"lesson, q1, q2, q3","animates":"Fades in with the lesson, then switches to each question.","clones":"No clones.","cool":"One sprite shows the lesson AND every question."},{"name":"Continue Button","costumes":"go","animates":"Appears 1.5 seconds after the lesson.","clones":"No clones.","cool":"Uses Lesson On so it only works once."},{"name":"Answer","costumes":"q1a1 … (one per answer)","animates":"Answer clones pop in; the right one grows, wrong ones fade.","clones":"3 clones per question (A, B, C).","cool":"Each clone uses its own My Answer."},{"name":"Quiz Mark","costumes":"tick, cross","animates":"Shows a tick or cross for 1.4 seconds.","clones":"No clones.","cool":"The picture is the feedback, not only the sound."},{"name":"Stars","costumes":"0 stars … 3 stars","animates":"Grows in, then switches costume once per star with a sound.","clones":"No clones.","cool":"Stars = Game Stars + Quiz Score, never more than 3."}]},"projects":{"intro":{"title":"Intro v2.1 – It Doesn't Just Happen","school":"All schools","file":"Intro v2.1 - It Doesnt Just Happen.sb3","rename":{"Show Speed":"Highlight Pause","Step":"Highlight Line","Demo On":"Lamp Demo On","Slow":"Slow Motion On","Tag For Step":"Tag For Highlight Line"},"variables":[{"name":"Costume Changes","scope":"all","kind":"counter","start":"0","why":"Counts how many times the runner has changed costume, so the loop knows when to stop.","changes":"The Runner sets it to 0, then \"change Costume Changes by 1\" inside the repeat loop. The green flag also sets it to 0.","when":"Every time the runner shows the next costume (every Frame Wait seconds).","effect":"The big number on screen goes up. When it reaches 16, \"repeat until Costume Changes = 16\" stops the loop.","times":"16 times in one run (0 to 16), then it is reset to 0 for the next run.","say":"Costume Changes is our counter. It goes up by one every time the runner changes picture, and when it reaches 16 the running stops."},{"name":"Frame Wait","scope":"all","kind":"rule","start":"0.1 seconds","why":"How long the runner waits between two costumes. It is our speed setting.","changes":"Green flag and START set it to 0.1. SLOW MOTION sets it to 0.3. The Runner sets it back to 0.1 after 3 slow costume changes.","when":"When a run starts, and once during the slow-motion run.","effect":"A bigger number = a slower runner. 0.1 looks like a movie; 0.3 lets us see each picture.","times":"Twice in a slow-motion run (0.3, then 0.1). Once in a normal run.","say":"Frame Wait is how long the runner waits between pictures. Make it bigger and he runs slower."},{"name":"Highlight Pause","old":"Show Speed","scope":"all","kind":"rule","start":"0 (no pause)","why":"How long the yellow highlight stays on each line of the code window, so viewers can follow the code.","changes":"Green flag and START set it to 0. SLOW MOTION sets it to 0.8. NEXT sets it to 0.7 for the lamp and bell scenes. The Runner sets it to 0 after 3 slow costumes.","when":"When a scene starts that shows a code window.","effect":"If it is more than 0, every highlight step waits this many seconds. If it is 0, the highlight is skipped and the code runs at full speed.","times":"About 5 times in the whole show.","say":"Highlight Pause is how long the yellow light stays on each code line. Zero means no pause."},{"name":"Highlight Line","old":"Step","scope":"all","kind":"memory","start":"0 (nothing glowing)","why":"Remembers which line of the code window should glow yellow right now.","changes":"Set by the small helper blocks \"set Highlight Line to (number), broadcast update window, wait Highlight Pause\" inside the Runner, Lamp and Bell scripts.","when":"Each time the real code moves to its next block during a slowed-down scene.","effect":"Each code window switches to costume (Highlight Line + 1), which has that line glowing. The Concept Tag clones also check it to light up EVENT, VARIABLE, IF/THEN or TIMER.","times":"Many times: about 9 times per lamp click and 10 times per slow run.","say":"Highlight Line tells the code window which line to light up, so you can see which block is running."},{"name":"Scene","scope":"all","kind":"counter","start":"0","why":"Remembers which scene of the show we are in.","changes":"The green flag sets it to 0. The Stage does \"change Scene by 1\" every time NEXT is clicked.","when":"Every time the presenter clicks NEXT.","effect":"The Stage asks \"if Scene = 1 … if Scene = 5\" and sets up only that scene: its backdrop, its caption and its broadcast.","times":"5 times in one show (1, 2, 3, 4, 5).","say":"Scene counts the NEXT clicks. The Stage looks at it to know which scene to show."},{"name":"Clicks","scope":"all","kind":"counter","start":"0","why":"Counts how many times the light switch was clicked.","changes":"\"change Clicks by 1\" when the lamp is clicked. Set to 0 at the green flag, at the start of the lamp scene, and after NEPA takes light.","when":"Each click on the lamp.","effect":"The IF block asks \"is Clicks more than 2?\" On the 3rd click the answer is yes: the light goes off for 2 seconds, then Clicks goes back to 0.","times":"No limit. It goes 1, 2, 3, then back to 0, as many times as you click.","say":"Clicks counts the switch clicks. On the third click, IF Clicks is more than 2, NEPA takes light and the count starts again."},{"name":"Lamp Demo On","old":"Demo On","scope":"all","kind":"switch","start":"0 (off)","why":"Tells the lamp and the concept tags that the lamp scene is running.","changes":"The Stage sets it to 1 when the lamp scene starts and to 0 when the bell scene starts.","when":"At the start and end of the lamp scene.","effect":"The lamp only reacts to clicks when it is 1. The concept tag clones keep glowing and fading only while it is 1.","times":"Twice in a show (on, then off).","say":"Lamp Demo On is a switch. When it is 1 the lamp works; when it is 0 clicking does nothing."},{"name":"Bell Ready","scope":"all","kind":"switch","start":"0 (off)","why":"Lets the bell ring only once, at the right time.","changes":"The Stage sets it to 1 when the classroom scene starts. The Bell sets it to 0 the moment it is clicked.","when":"At the start of the bell scene, and on the first bell click.","effect":"The bell only sends \"break time\" if Bell Ready = 1, so a second click does nothing.","times":"Twice in a show.","say":"Bell Ready is a switch so the bell can only ring once."},{"name":"Slow Motion On","old":"Slow","scope":"all","kind":"switch","start":"0 (off)","why":"Remembers if this run of the runner is the normal run or the slow-motion run.","changes":"START sets it to 0. SLOW MOTION sets it to 1.","when":"When START or SLOW MOTION is clicked.","effect":"The Runner is smaller and lower in slow motion, and speeds up after 3 costumes. After the run, the Stage shows a different caption and only offers SLOW MOTION after a normal run.","times":"Once per run.","say":"Slow Motion On tells everyone if we are running fast or slow, so they act differently."},{"name":"Caption","scope":"all","kind":"message","start":"(empty)","why":"Holds the NAME of the caption to show, for example \"nepa\" or \"heard\".","changes":"Set by the Stage, the Lamp and the Bell just before they broadcast \"caption\".","when":"Every time a new big sentence should appear.","effect":"The Caption sprite switches to the costume with that name and shows it at the top.","times":"About 9 times in a show.","say":"Caption holds the name of the sentence to show. The Caption sprite reads it and switches costume."},{"name":"Tag For Highlight Line","old":"Tag For Step","scope":"all","kind":"list","start":"1, 2, 0, 0, 3, 0, 4, 2, 0","why":"For each line of the lamp code, which concept tag should light up (1 EVENT, 2 VARIABLE, 3 IF/THEN, 4 TIMER, 0 none).","changes":"Never changes. It is set when the project is made.","when":"It is only read, never changed.","effect":"When Highlight Line is 2 (the \"change Clicks\" line), item 2 is 2, so the VARIABLE tag lights up.","times":"0 times. It is a lookup table.","say":"This list is a lookup table: it tells each line of code which magic word it belongs to."},{"name":"My Tag","scope":"Concept Tag","kind":"memory","start":"0","why":"Each Concept Tag clone remembers its own number: 1 EVENT, 2 VARIABLE, 3 IF/THEN, 4 TIMER.","changes":"The original sprite changes My Tag by 1 and makes a clone, 4 times. Each clone keeps the number it was born with.","when":"Once, when the lamp scene starts.","effect":"The clone wears costume number My Tag and lights up when the list says its number.","times":"4 times in the original sprite (1, 2, 3, 4, then back to 0). Never in a clone.","say":"My Tag is \"for this sprite only\", so every clone has its own copy and knows which tag it is."}],"sprites":[{"name":"Stage","costumes":"title, plain, dark, classroom, playground (5 backdrops)","animates":"Switches backdrop when a scene starts, and to playground when it hears \"break time\".","clones":"No clones.","cool":"It is the director: its NEXT script uses Scene to set up each scene."},{"name":"Title","costumes":"title","animates":"Grows by 4 and shrinks by 4, three times, with a quarter-second wait: a heartbeat.","clones":"No clones.","cool":"Hides itself when it hears \"run flipbook\"."},{"name":"START Button","costumes":"start","animates":"Shows at the bottom; hides when clicked.","clones":"No clones.","cool":"One click sets Slow Motion On = 0, Frame Wait = 0.1 and sends \"run flipbook\"."},{"name":"Runner","costumes":"frame 1 … frame 16 (8 drawings, used twice)","animates":"Flipbook: inside a loop he shows the next costume, moves 25 steps right and waits Frame Wait. The legs and arms are drawn at a different angle in each costume, so it looks like running.","clones":"No clones.","cool":"The pictures were drawn by maths: each leg angle = 35 × sin(step), so the run is smooth."},{"name":"Runner Code, Lamp Code, Bell Code","costumes":"none + step 1, step 2 … (one per code line)","animates":"Each costume is the same code picture with a different line glowing yellow. It switches to costume (Highlight Line + 1).","clones":"No clones.","cool":"It looks like the code is running live, but it is just costume switching."},{"name":"SLOW MOTION Button","costumes":"slow","animates":"Shows half a second after the first run.","clones":"No clones.","cool":"Sets Frame Wait to 0.3 and Highlight Pause to 0.8, then sends \"run flipbook\" again."},{"name":"Caption","costumes":"saw, slow done, rule, life, demo, nepa, back, bell, heard (9)","animates":"Switches to the costume named in the variable Caption and shows at the top.","clones":"No clones.","cool":"Every caption is a picture, so a Deaf viewer can follow every scene."},{"name":"NEXT Button","costumes":"next","animates":"Appears half a second after a scene is ready.","clones":"No clones.","cool":"Its only job is to broadcast \"next\". The Stage does the rest."},{"name":"Rule Card","costumes":"rule","animates":"Pops in: starts at 20% size and grows 10% eight times.","clones":"No clones.","cool":"Shows WHEN → THEN, the rule of every program."},{"name":"Life Card","costumes":"rows 1, rows 2, rows 3","animates":"Reveals one row at a time by switching costume every 1.5 seconds, with a pop sound.","clones":"No clones.","cool":"Three costumes, each with one more row, look like rows sliding in."},{"name":"Lamp","costumes":"light off, light on","animates":"Switches costume and says \"UP NEPA!\" for 1 second.","clones":"No clones.","cool":"One script uses all four magic words: event, variable, if/then, timer."},{"name":"Concept Tag","costumes":"event, variable, logic, timer","animates":"Each clone is faded (ghost 60) and small, until its line runs: then ghost 0, full size and in front.","clones":"4 clones of one sprite, made with \"change My Tag by 1, create clone of myself\" 4 times.","cool":"One script controls all 4 tags because each clone reads its own My Tag."},{"name":"Bell","costumes":"bell","animates":"Wiggles: turns right 15°, waits, turns left 15°, three times.","clones":"No clones.","cool":"It only SENDS \"break time\". It does not move any other sprite."},{"name":"Pupil","costumes":"sitting, cheering","animates":"Switches to cheering when it hears \"break time\".","clones":"No clones.","cool":"One of four listeners."},{"name":"Book","costumes":"book","animates":"Hides when it hears \"break time\".","clones":"No clones.","cool":"A listener."},{"name":"Football","costumes":"ball","animates":"Shows when it hears \"break time\".","clones":"No clones.","cool":"A listener."},{"name":"End Card","costumes":"end","animates":"Pops in from 30% to 100%.","clones":"No clones.","cool":"Lists the 9 games of the 3 schools."}],"scenes":[{"n":0,"name":"Title","trigger":"Green flag","backdrop":"title","shows":"Title (heartbeat) and START","ends":"START is clicked"},{"n":1,"name":"Runner (fast)","trigger":"START → broadcast \"run flipbook\"","backdrop":"dark","shows":"Runner runs 16 costumes; the Costume Changes number counts up; caption \"You saw a MOVIE…\"","ends":"Runner broadcasts \"flipbook done\"; SLOW MOTION and NEXT appear"},{"n":"1b","name":"Runner (slow motion)","trigger":"SLOW MOTION → \"run flipbook\" with Slow Motion On = 1","backdrop":"dark","shows":"Smaller runner + the Runner Code window; yellow highlight follows each block for 3 costumes, then speeds up","ends":"\"flipbook done\"; caption \"Same 4 blocks, 16 times. That is a LOOP!\"; NEXT appears"},{"n":2,"name":"The rule","trigger":"NEXT → Scene = 1","backdrop":"plain","shows":"Rule Card WHEN → THEN","ends":"NEXT"},{"n":3,"name":"Real life","trigger":"NEXT → Scene = 2","backdrop":"plain","shows":"Life Card reveals 3 rows (bell, NEPA, Mum)","ends":"NEXT"},{"n":4,"name":"The NEPA lamp","trigger":"NEXT → Scene = 3 (Lamp Demo On = 1)","backdrop":"dark","shows":"Lamp, Lamp Code window, 4 Concept Tags, the Clicks number. 3rd click: NEPA takes light for 2 seconds","ends":"NEXT"},{"n":5,"name":"The school bell","trigger":"NEXT → Scene = 4 (Bell Ready = 1)","backdrop":"classroom → playground","shows":"Bell, Pupil, Book, Bell Code. One bell click → \"break time\" → 4 listeners act","ends":"NEXT"},{"n":6,"name":"The end card","trigger":"NEXT → Scene = 5","backdrop":"title","shows":"End Card with the 9 games, fanfare","ends":"The show ends (green flag starts again)"}]},"honest":{"title":"Honest Scale v2.1","school":"Methodist High School","file":"Honest Scale v2.1.sb3","rename":{"k":"Chart Point","Pmax":"Highest Profit","Pmin":"Lowest Profit","Px":"Dot X","Py":"Dot Y","F":"Costume Frame","Target":"Stop X","Cust X":"Customer X","Cust Y":"Customer Y"},"variables":[{"name":"Price Per Kg, Profit Per Kg","kind":"rule","start":"1,500 and 200","why":"What the customer pays for 1 kg, and what Mama T earns on 1 honest kg.","changes":"Only the green flag sets them.","when":"Never during play.","effect":"They are used in the profit sum: (Wanted × 1,500) − (Needle × 1,300).","times":"Never (you change them by hand).","say":"Price Per Kg is the selling price; Profit Per Kg is what we keep from each honest kilo.","scope":"all"},{"name":"Trust Gain, Trust Penalty, Generous Trust, Impatient Penalty","kind":"rule","start":"8, 25, 12, 5","why":"How much trust goes up or down after each customer.","changes":"Only the green flag sets them.","when":"Never during play.","effect":"Honest +8, cheat −25, extra +12, too slow −5.","times":"Never.","say":"These four numbers decide how fast trust rises and falls.","scope":"all"},{"name":"Start Trust, Win Trust, Walkaway Trust","kind":"rule","start":"50, 60, 30","why":"Trust at the start, trust needed to be TRUSTED, and trust below which customers walk away.","changes":"Only the green flag sets them.","when":"Never during play.","effect":"Trust below 30 sends the next customer to Iya Bisi.","times":"Never.","say":"Start, win and walk-away trust are the three trust levels.","scope":"all"},{"name":"Fine, Max Kg, Scoop Time","kind":"rule","start":"10,000, 10, 0.3","why":"The inspector's fine, the biggest weight the scale shows, and seconds per scoop.","changes":"Only the green flag sets them.","when":"Never during play.","effect":"A cheat loses ₦10,000; you cannot scoop past 10 kg; each scoop takes 0.3 s.","times":"Never.","say":"These are our fine, scale size and scoop speed rules.","scope":"all"},{"name":"Profit ₦","kind":"counter","start":"0","why":"All the money Mama T has made today.","changes":"The Stage adds Gain after each sale and subtracts the Fine if she is caught.","when":"After each sale.","effect":"The ₦ number in the top bar changes; it is also saved in Profit History for the chart.","times":"Up to 9 times (8 sales + 1 fine).","say":"Profit is our total money today. It changes after every sale.","scope":"all"},{"name":"Trust","kind":"counter","start":"50","why":"How much customers trust the shop, from 0 to 100.","changes":"The Stage adds or subtracts after each customer, then keeps it between 0 and 100.","when":"After each customer.","effect":"The trust bar and face change; below 30 customers walk away; at 0 the shop closes.","times":"Up to 8 times.","say":"Trust is how much people believe our scale. Cheating makes it fall.","scope":"all"},{"name":"Customer, Customers","kind":"counter","start":"0 and 8","why":"Which customer we are serving, and how many come today.","changes":"Customers = length of the Arrivals list. Customer goes up by 1 in the main loop.","when":"At the start of each customer.","effect":"The loop stops when Customer reaches Customers. The top bar shows 3/8.","times":"Customer: 8 times.","say":"Customer counts the customers; Customers is how many come.","scope":"all"},{"name":"Vehicle","kind":"message","start":"(empty)","why":"How the current customer arrives: walk, okada, keke, car or inspector.","changes":"The Stage sets it to item Customer of Arrivals.","when":"Once per customer.","effect":"Every vehicle sprite checks \"if Vehicle = my name\" so only the right one moves.","times":"8 times.","say":"Vehicle tells the right sprite to come in.","scope":"all"},{"name":"Wanted","kind":"memory","start":"0","why":"How many kg the customer asked for.","changes":"The Stage picks a random number (bigger for cars).","when":"Once per customer.","effect":"The order ticket shows it, and it is compared with Needle.","times":"8 times.","say":"Wanted is what the customer asked for.","scope":"all"},{"name":"Needle","kind":"counter","start":"0","why":"How many kg are on the scale.","changes":"The scoop worker adds or removes 1 per scoop; set to 0 for each customer.","when":"Each scoop.","effect":"The scale switches to costume k + Needle (the needle drawing) and the rice heap grows.","times":"Many times per customer.","say":"Needle is the weight on the scale. Each scoop moves it by one.","scope":"all"},{"name":"Pending","kind":"counter","start":"0","why":"Scoops you asked for that are not done yet.","changes":"UP adds 1, DOWN subtracts 1; the scoop worker uses them up one by one.","when":"Every key press or button click.","effect":"No fast press is lost: the worker keeps scooping until Pending is 0.","times":"Many times.","say":"Pending is a queue of scoops waiting to happen.","scope":"all"},{"name":"Busy","kind":"switch","start":"0","why":"Tells the Stage a scoop is in progress.","changes":"The scoop worker sets it to 1 before a scoop and 0 after.","when":"Each scoop.","effect":"The Stage waits until Busy = 0 before handing over the rice.","times":"2 times per scoop.","say":"Busy means Mama T is still scooping.","scope":"all"},{"name":"Sell Asked, Handed","kind":"switch","start":"0","why":"Sell Asked = SELL was pressed. Handed = the rice was really handed over.","changes":"SPACE/SELL sets Sell Asked = 1. The worker sets Handed = 1 when all scoops are done.","when":"Once per customer.","effect":"The patience loop stops and the sale is worked out.","times":"Once per customer each.","say":"SELL asks to sell; Handed means it happened.","scope":"all"},{"name":"Accepting","kind":"switch","start":"0","why":"The shop is taking this customer's order.","changes":"The Stage sets 1 while the customer waits, 0 after.","when":"Each customer.","effect":"Keys and buttons only work while it is 1.","times":"Twice per customer.","say":"Accepting means we can serve now.","scope":"all"},{"name":"Patience, Patience Max","kind":"counter","start":"16, 12, 14, 10 or 40","why":"How long this customer will wait (cars wait least, the inspector most).","changes":"Patience Max is set by vehicle; Patience goes down by 0.1 every 0.1 s.","when":"All the time while waiting.","effect":"The patience bar shrinks; at half the customer horns; at 0 they leave and trust falls.","times":"Up to 400 times per customer.","say":"Patience is the customer's clock. When it runs out, they leave.","scope":"all"},{"name":"Honked","kind":"switch","start":"0","why":"So the customer only horns once.","changes":"Set to 1 when patience is half gone.","when":"Once per customer.","effect":"The \"impatient\" message is sent only once.","times":"Once per customer.","say":"Honked stops the horn repeating.","scope":"all"},{"name":"Gain","kind":"memory","start":"0","why":"The profit from this one sale.","changes":"(Wanted × Price Per Kg) − (Needle × (Price Per Kg − Profit Per Kg)).","when":"Once per sale.","effect":"Added to Profit; the money notes say \"+₦\" Gain.","times":"8 times.","say":"Gain is what this one customer made us.","scope":"all"},{"name":"Result","kind":"message","start":"(empty)","why":"What happened with this customer: honest, cheat, generous, left, walked, fined or certified.","changes":"The Stage sets it after comparing Needle and Wanted.","when":"Once per customer.","effect":"The Feedback sign, Mama T's face and the customer's words all depend on it.","times":"8 times.","say":"Result is the verdict for each customer.","scope":"all"},{"name":"Cheated, Walked Last","kind":"switch","start":"0","why":"Cheated = this shop has cheated today. Walked Last = the last customer walked away.","changes":"Set by the Stage.","when":"When a cheat happens / when someone walks away.","effect":"Cheated: the scale turns into the cracked one and the inspector fines you. Walked Last: the next customer stays (no two walk-aways in a row).","times":"Once each, or a few times.","say":"Cheated is our bad record; the inspector checks it.","scope":"all"},{"name":"Ending, Best Profit","kind":"message","start":"(empty), 0","why":"The end of the day (trusted, rich or closed), and the best honest profit.","changes":"Set once at the end.","when":"Once.","effect":"Ending picks the caption and the sound.","times":"Once.","say":"Ending is how our day finished.","scope":"all"},{"name":"Car Count, Car Color","kind":"counter","start":"0","why":"Which car this is and its colour, so cars change colour.","changes":"The Stage adds 1 to Car Count and picks item from Car Colors.","when":"For each car.","effect":"The car switches to costumes of that colour.","times":"2 times (two cars).","say":"Car Color makes every car look different.","scope":"all"},{"name":"Customer X, Customer Y","kind":"memory","start":"0","why":"Where the customer stopped, so the rice bag and money know where to fly.","changes":"The vehicle sets them when it stops.","when":"Once per customer.","effect":"The bag eases to that spot; the money eases from it.","times":"8 times.","say":"Customer X and Y are the customer's address on the screen.","scope":"all","old":"Cust X, Cust Y"},{"name":"Arrivals","kind":"list","start":"walk, okada, car, keke, inspector, car, walk, keke","why":"Who comes today, in order.","changes":"The green flag refills it.","when":"Only at the green flag.","effect":"Change it and the day changes.","times":"Never during play.","say":"Arrivals is the day's guest list.","scope":"all"},{"name":"Car Colors","kind":"list","start":"silver, red, black","why":"The colours a car can be.","changes":"Never changes.","when":"Only read.","effect":"Car Color is picked from it.","times":"Never.","say":"The car paint list.","scope":"all"},{"name":"Profit History, Trust History","kind":"list","start":"one number","why":"Profit and trust after every customer, for the chart.","changes":"The Stage adds one value of each after every customer.","when":"After each customer.","effect":"The Chart Pen draws a line through them.","times":"9 items each.","say":"These lists remember the whole day so we can draw it.","scope":"all"},{"name":"Chart Po ay drive. Arrived = you reached M. Pausing = a middleman is talking, so the clock stops.","changes":"Set by the Stage and the truck.","when":"Start/end of trip, at gates.","effect":"The drive loop runs while Moving = 1; the trip ends when Arrived = 1.","times":"Twice each per trip, Pausing at every gate.","say":"These switches start, pause and end a trip.","scope":"all"},{"name":"Paid Gate 1, Paid Gate 2, Paid Gate 3, Paid Co-op","kind":"switch","start":"0","why":"Have we already paid at this gate?","changes":"The truck sets 1 the first time it enters the gate.","when":"Once per gate per trip.","effect":"A gate only charges once, even if you drive back over it.","times":"Once each per trip.","say":"They stop a gate charging twice.","scope":"all","old":"Paid1, Paid2, Paid3, PaidC"},{"name":"Gate, Last Cut, Route","kind":"memory","start":"0","why":"Which gate we are at, its cut, and the road type (middleman or coop).","changes":"Set by the truck at a gate.","when":"At each gate.","effect":"Only the middleman whose number = Gate speaks and takes Last Cut.","times":"Per gate.","say":"Gate tells the right middleman to speak.","scope":"all"},{"name":"Seg Farmer, Seg Buyer, Seg Transport, Seg Seller, Seg Coop, Farmer %","kind":"memory","start":"0","why":"How the price is split, and the farmer's percentage.","changes":"The Stage works them out at the market.","when":"Once per trip.","effect":"The pen draws each part of the bar; \"The farmer got 33%\".","times":"Once per trip.","say":"They split the price into who got what.","scope":"all"},{"name":"Trip 1 Price, Trip 1 Share, Trip 2 Price, Trip 2 Share, Tallest Price","kind":"memory","start":"0","why":"The results of both trips, and the tallest bar.","changes":"Saved at the end of each trip.","when":"Once per trip.","effect":"The compare chart and the verdict use them.","times":"Once each.","say":"They remember both trips for the final chart.","scope":"all","old":"T1 Price, T1 Share, T2 Price, T2 Share, k"},{"name":"Maze","kind":"list","start":"7 rows of letters","why":"The map: # wall, . road, 1 2 3 middlemen, C co-op, F farm, M market.","changes":"Never changes.","when":"Only read.","effect":"The truck reads it; the backdrop was drawn from it.","times":"Never.","say":"Maze is our map written as letters.","scope":"all"},{"name":"Target X, Target Y","kind":"helper","start":"0","why":"Where the truck is gliding to.","changes":"Set when it moves.","when":"Each move.","effect":"It moves 45% of the way 6 times.","times":"Per move.","say":"They are where the truck is going.","scope":"Truck","old":"TX, TY"}],"sprites":[{"name":"Truck","costumes":"truck (our picture)","animates":"Glides one square in 6 small steps; flips left/right.","clones":"No clones.","cool":"Reads the Maze list to know where it can go."},{"name":"Price Tag","costumes":"tag","animates":"Rides on the truck; size = 30 + Price ÷ 600; flashes at gates.","clones":"No clones.","cool":"You can SEE the price grow."},{"name":"Village Buyer, Transporter, Market Seller, Co-op Lady","costumes":"idle, wave","animates":"Wave and speak when it is their gate.","clones":"No clones.","cool":"Only the one with the matching Gate number reacts."},{"name":"Coins","costumes":"c","animates":"Eases from the truck to the middleman.","clones":"No clones.","cool":"The money moving is visible."},{"name":"Pad right, left, up, down","costumes":"b","animates":"Show on the map.","clones":"No clones.","cool":"One costume, rotated by our builder."},{"name":"Chart Pen","costumes":"dot","animates":"Draws the breakdown bar and the 4 compare bars.","clones":"No clones.","cool":"Bar width = part ÷ price × 380."},{"name":"Verdict Card, Farmer","costumes":"good, bad / happy, sad","animates":"Fade in at the end.","clones":"No clones.","cool":"The verdict depends on Trip 2 Share > Trip 1 Share."}],"scenes":[{"n":1,"name":"Title","trigger":"Green flag","backdrop":"map","shows":"Title, PLAY, HOW TO PLAY","ends":"PLAY"},{"n":2,"name":"How to play","trigger":"\"show help\"","backdrop":"help","shows":"Help Card","ends":"PLAY"},{"n":3,"name":"Trip 1","trigger":"\"start game\" → Trip = 1","backdrop":"map","shows":"Middlemen, lock on the co-op, truck, pads, HUD","ends":"Truck reaches M, or time runs out"},{"n":4,"name":"Breakdown 1","trigger":"Arrived","backdrop":"breakdown","shows":"Coloured bar, amounts, \"The farmer got 33%\"","ends":"After 5 seconds"},{"n":5,"name":"Trip 2","trigger":"Trip = 2","backdrop":"map","shows":"Co-op Lady, co-op road open","ends":"Truck reaches M"},{"n":6,"name":"Breakdown 2","trigger":"Arrived","backdrop":"breakdown","shows":"\"The farmer got 80%\"","ends":"After 5 seconds"},{"n":7,"name":"Compare chart","trigger":"After 2 trips","backdrop":"compare","shows":"Trip 1 vs Trip 2 bars, verdict card, farmer","ends":"After 5 seconds"},{"n":8,"name":"Lesson, quiz, stars","trigger":"\"lesson\"","backdrop":"help","shows":"Lesson, 2 questions, stars","ends":"PLAY AGAIN"}]},"naira":{"title":"Shrinking Naira v2.1","school":"Unity High School","file":"Shrinking Naira v2.1.sb3","rename":{"i":"Food Number","H":"Bar Height","Old":"Old Price","New":"New Price","Step":"Climb Step","Role":"Copy Role","Slot":"Arrow Slot"},"variables":[{"name":"Money ₦","kind":"rule","start":"5,000","why":"What Mum has for market EVERY month.","changes":"Only the green flag.","when":"Never during play.","effect":"Compared with the basket total every month.","times":"Never — that is the point!","say":"Money never changes. That is why inflation hurts.","scope":"all"},{"name":"Rice Start ₦, Bread Start ₦, Eggs Start ₦, Tomatoes Start ₦, Palm oil Start ₦","kind":"rule","start":"1,800, 1,200, 900, 600, 500","why":"Each food's price in Month 1.","changes":"Only the green flag.","when":"Never during play.","effect":"Copied into the Prices list at the start.","times":"Never.","say":"Start prices add up to exactly ₦5,000.","scope":"all"},{"name":"Rice Rise %, Bread Rise %, Eggs Rise %, Tomatoes Rise %, Palm oil Rise %","kind":"rule","start":"20, 10, 15, 25, 12","why":"How much each food's price rises every month.","changes":"Only the green flag.","when":"Never during play.","effect":"Copied into the Rise list.","times":"Never.","say":"Rise % is how fast each price climbs.","scope":"all"},{"name":"Month","kind":"counter","start":"1","why":"Which month we are in.","changes":"The Stage adds 1 after NEXT MONTH.","when":"Each NEXT MONTH.","effect":"The calendar flips to that month.","times":"5 times (1 to 6).","say":"Month counts the months.","scope":"all"},{"name":"Prices","kind":"list","start":"5 prices","why":"The price of each food now.","changes":"Replaced 12 times per month during the climb.","when":"Each month.","effect":"The 5 price tags show item 1–5.","times":"60 changes per food over the game.","say":"Prices holds today's price of every food.","scope":"all"},{"name":"Start Prices, Rise","kind":"list","start":"5 numbers each","why":"Prices at the start of this month's climb, and each food's Rise %.","changes":"Start Prices is copied each month; Rise never changes in play.","when":"Each month.","effect":"The climb moves from Old Price to New Price.","times":"Start Prices: 5 times.","say":"They help the prices climb smoothly.","scope":"all"},{"name":"Status","kind":"list","start":"1, 1, 1, 1, 1","why":"1 = we still buy this food, 0 = we gave it up.","changes":"Set to 0 when a food is dropped.","when":"When you tap a food, or it costs more than all the money.","effect":"The food fades, gets a CAN'T AFFORD stamp, and is not added to the basket.","times":"Each food changes at most once.","say":"Status remembers which foods we still buy.","scope":"all"},{"name":"Basket Total ₦","kind":"counter","start":"5,000","why":"What the foods we still buy cost now.","changes":"Recomputed by adding prices where Status = 1.","when":"During the climb and the checkout.","effect":"If it is more than Money, you must drop a food.","times":"Many times.","say":"Basket Total is what our shopping costs now.","scope":"all"},{"name":"Full Cost ₦, Month 1 Cost, Inflation %","kind":"memory","start":"5,000, 5,000, 0","why":"The cost of ALL 5 foods, the January cost, and how much prices rose.","changes":"Computed during the climb.","when":"Each climb step.","effect":"PRICES UP SINCE MONTH 1 shows Inflation % = (Full Cost ÷ Month 1 Cost − 1) × 100.","times":"About 60 times.","say":"Inflation % tells how much more the same basket costs now.","scope":"all"},{"name":"Basket Cost","kind":"list","start":"(empty)","why":"The full basket cost of each month, for the chart.","changes":"One value added each month.","when":"Once per month.","effect":"The chart draws one bar per item.","times":"6 items.","say":"Basket Cost is the chart's data.","scope":"all"},{"name":"Climb Step, Old Price, New Price","kind":"helper","start":"0","why":"Which of the 12 climb steps we are on, and the price before and after.","changes":"The climb loop.","when":"12 times per month.","effect":"Price = Old + (New − Old) × Climb Step ÷ 12.","times":"12 per month.","say":"They make prices count up slowly.","scope":"all","old":"Step, Old, New"},{"name":"Food Number","kind":"counter","start":"0","why":"Which food (1–5) a loop is working on.","changes":"Loops change it by 1.","when":"Inside many loops.","effect":"Item Food Number of a list is read or changed.","times":"Many times.","say":"Food Number points at one food in the lists.","scope":"all","old":"i"},{"name":"Waiting Remove, Last Removed","kind":"memory","start":"0","why":"Waiting for you to tap a food, and which food was dropped.","changes":"The Stage sets Waiting Remove = 1; a food tap sets it to 0 and Last Removed.","when":"When the basket is too dear.","effect":"The foods bounce until you choose; the caption names the lost food.","times":"A few times per game.","say":"They wait for my choice and remember it.","scope":"all"},{"name":"Frozen","kind":"switch","start":"0","why":"The game is frozen for the signers.","changes":"F key or the hand button flips it.","when":"Whenever you freeze.","effect":"Everything waits until Frozen = 0; the FROZEN screen shows.","times":"As often as you press F.","say":"Frozen stops everything so we can sign the explanation.","scope":"all"},{"name":"Ready, Next Clicked","kind":"memory","start":"0","why":"Ready = 1 shows NEXT MONTH, 2 shows SEE RESULTS. Next Clicked = the button was clicked.","changes":"Set by the Stage and the button.","when":"Each month.","effect":"The Stage waits until Next Clicked = 1.","times":"6 times.","say":"They wait for NEXT MONTH.","scope":"all"},{"name":"Change ₦, Foods Left, Chart Max, Bar Height","kind":"memory","start":"0","why":"Mum's change, foods still bought, tallest bar, and one bar's height.","changes":"Computed by the Stage and the pen.","when":"After paying / at the end.","effect":"CHANGE shows; \"1 food\"; bars fit on the chart.","times":"Once per month or once.","say":"They are the results we show.","scope":"all","old":"H (Bar Height)"},{"name":"My Food, Copy Role","kind":"memory","start":"0","why":"Each food clone's number, and its job: 1 table, 2 Month 1 panel, 3 Month 6 panel.","changes":"The original sets them before each clone.","when":"When clones are made.","effect":"Each clone wears costume f + My Food and goes to the right place.","times":"Per clone.","say":"They tell each copy which food it is and where to stand.","scope":"Food","old":"Role"},{"name":"Buy X, Buy Y","kind":"list","start":"5 numbers each","why":"Where the 5 foods stand on the buys page.","changes":"Never change.","when":"Only read.","effect":"Copies go to item My Food.","times":"Never.","say":"Addresses on the buys page.","scope":"all"},{"name":"Arrow Slot","kind":"memory","start":"0","why":"Each UP arrow clone's food number.","changes":"The original makes 5 clones.","when":"Each month.","effect":"The arrow goes over that food.","times":"5 per month.","say":"Each arrow knows its food.","scope":"Price Arrow","old":"Slot"}],"sprites":[{"name":"Food","costumes":"f1–f5","animates":"Pop in; bounce while you choose; shake and fade when dropped; fly into the basket.","clones":"Clones: 5 on the table, then 10 on the buys page.","cool":"Copy Role decides each clone's job."},{"name":"Tag 1–5 and HUD numbers","costumes":"digits","animates":"Count up as prices climb.","clones":"One clone per character.","cool":"They redraw only when the number changes."},{"name":"Calendar","costumes":"m1–m6","animates":"Flies to the middle, turns and fades, shows the new month, shrinks to the corner.","clones":"No clones.","cool":"Easing + size + turn + ghost in one animation."},{"name":"Price Arrow","costumes":"up","animates":"Rises and fades over each food.","clones":"5 clones.","cool":"Each clone reads its own Arrow Slot."},{"name":"Can't Afford Stamp","costumes":"stamp","animates":"Grows onto a dropped food.","clones":"One clone per dropped food.","cool":"The stamp stays, so you remember what you lost."},{"name":"Keke, Okada, Mum, Basket, Iya Oja","costumes":"wheel and walk costumes","animates":"Drive in, walk, fade.","clones":"No clones.","cool":"Real Nigerian market trip."},{"name":"Freeze Button, Freeze Overlay","costumes":"hand, dim","animates":"Dark screen with FROZEN.","clones":"No clones.","cool":"Made for our signers."}],"scenes":[{"n":1,"name":"Title","trigger":"Green flag","backdrop":"market","shows":"Title, PLAY, HOW TO PLAY, Mum, Iya Oja","ends":"PLAY"},{"n":2,"name":"How to play","trigger":"\"show help\"","backdrop":"help","shows":"Help Card","ends":"PLAY"},{"n":3,"name":"Month 1","trigger":"\"start game\" → keke → calendar","backdrop":"market","shows":"Everything fits; Mum pays; change ₦0","ends":"NEXT MONTH"},{"n":4,"name":"Months 2–6 (5 scenes)","trigger":"NEXT MONTH → Month + 1","backdrop":"market","shows":"Calendar flips → prices climb → too expensive? choose → pay","ends":"NEXT MONTH / SEE RESULTS"},{"n":5,"name":"Going home","trigger":"SEE RESULTS → \"go home\"","backdrop":"market","shows":"Okada takes Mum home","ends":"Okada leaves"},{"n":6,"name":"Chart","trigger":"\"draw chart\"","backdrop":"chart","shows":"Monthly bars vs the green money line","ends":"After 5 seconds"},{"n":7,"name":"What the same money buys","trigger":"\"show buys\"","backdrop":"buys","shows":"Month 1 vs Month 6 baskets","ends":"After about 9 seconds"},{"n":8,"name":"Lesson, quiz, stars","trigger":"\"lesson\"","backdrop":"help","shows":"Lesson, 3 questions, stars","ends":"PLAY AGAIN"}]},"barn":{"title":"The Empty Barn v2.1","school":"Unity High School","file":"The Empty Barn v2.1.sb3","rename":{"N":"Picked Stall","Spot":"Stall Being Checked","Anim":"Animation Frame","Pop":"Popup Name","Pop Spot":"Popup Stall","MyType":"My Type","Where":"Where Am I","DX":"Step X","DY":"Step Y","Vax Spot":"Vaccine Stall","Gap":"Current Gap","Faster":"Faster Started","TX":"Target X","TY":"Target Y"},"variables":[{"name":"Game Length, Win Animals, Vaccines","kind":"rule","start":"60, 6, 3","why":"Seconds until sunset, animals to keep to win, vaccines in the vet box.","changes":"Only the green flag.","when":"Never during play.","effect":"They decide when the day ends and who wins.","times":"Never.","say":"Day length, the win line and our vaccines.","scope":"all"},{"name":"Sick Gap, Early Window, Spread Time, Recovery Time","kind":"rule","start":"4, 4, 5, 8","why":"Seconds between new sick animals, early-sign time, time before a very sick animal is lost, and pen rest time.","changes":"Only the green flag.","when":"Never during play.","effect":"They control how fast sickness moves.","times":"Never.","say":"These four are the speed of the sickness.","scope":"all"},{"name":"Early Points, Sick Points, Wrong Penalty","kind":"rule","start":"20, 10, 5","why":"Points for early and late catches, and the penalty for tapping a healthy animal.","changes":"Only the green flag.","when":"Never.","effect":"Used when you tap.","times":"Never.","say":"Point rules.","scope":"all"},{"name":"Health","kind":"list","start":"0 × 9","why":"Each stall's state: 0 healthy, 1 early, 2 very sick, 3 isolated, 4 lost, 5 carried, 6 vaccinated, 7 waiting.","changes":"The Stage, the animals and the farmhand replace items.","when":"All the time.","effect":"Every animal clone picks its costume and place from its own item.","times":"Many times per stall.","say":"Health is the farm's medical record.","scope":"all"},{"name":"Since","kind":"list","start":"0 × 9","why":"When each stall last changed (the timer), so the Stage knows how long it has been sick.","changes":"Set with the timer when health changes.","when":"With Health.","effect":"Early → very sick after 4 s; very sick → lost after 5 s; isolated → healthy after 8 s.","times":"Many times.","say":"Since is each stall's stopwatch.","scope":"all"},{"name":"Animal Type","kind":"list","start":"goat, hen, sheep, duck, goat, hen, sheep, duck, goat","why":"Which animal lives in each stall (1–4).","changes":"Never changes.","when":"Only read.","effect":"Each clone copies it into My Type.","times":"Never.","say":"The list of who lives where.","scope":"all"},{"name":"Score, Animals Left, Time Left, Time Level","kind":"counter","start":"0, 9, 60, 10","why":"Points, animals still alive, seconds to sunset, and the bar size.","changes":"Changed by taps, losses and the clock.","when":"All game.","effect":"The HUD numbers and bar.","times":"Many times.","say":"Our score, animals and clock.","scope":"all"},{"name":"Next Sick At, Current Gap, Faster Started","kind":"memory","start":"1.5, 4, 0","why":"When the next animal gets sick, the gap now, and if the speed-up happened.","changes":"The Stage adds Current Gap; at half time Current Gap = Sick Gap × 0.6.","when":"Each new case / once at half time.","effect":"Sickness comes faster in the second half.","times":"About 15 times / once.","say":"They make the outbreak speed up.","scope":"all","old":"Gap, Faster"},{"name":"Picked Stall, Tries, Stall Being Checked","kind":"helper","start":"0","why":"Which stall to make sick (and how many tries), and which stall the checking loop is on.","changes":"The Stage, every 0.05 s.","when":"All game.","effect":"A healthy stall is chosen; each stall is checked in turn.","times":"Thousands of times.","say":"They help the Stage check every stall.","scope":"all","old":"N, Spot"},{"name":"Last Lost","kind":"memory","start":"0","why":"The stall that was just lost.","changes":"Set when an animal is lost.","when":"Each loss.","effect":"The germ cloud and LOST sign go there; its neighbours get infected.","times":"Up to 9 times.","say":"Last Lost is where the sickness spread from.","scope":"all"},{"name":"Early Catches, Late Catches, Lost Count, Outcome","kind":"counter","start":"0","why":"Results, and the end: strong, weak or empty.","changes":"Taps and losses change them; Outcome is set at sunset.","when":"During play / once.","effect":"The results bars and the ending caption.","times":"Per event / once.","say":"They are our final results.","scope":"all"},{"name":"Carry Queue","kind":"list","start":"(empty)","why":"Stalls waiting for the farmhand, in order.","changes":"A tap adds the stall; the farmhand deletes item 1.","when":"Each tap / each carry.","effect":"The first animal tapped is carried first.","times":"Per tap.","say":"Carry Queue is the farmhand's to-do list.","scope":"all"},{"name":"Carry Stall","kind":"memory","start":"0","why":"The stall the farmhand is working on.","changes":"The farmhand sets it from item 1 of Carry Queue.","when":"Each carry.","effect":"He walks there and then to the pen.","times":"Per carry.","say":"Carry Stall is his current job.","scope":"all"},{"name":"Vaccines Left, Vaccine Mode, Vaccine Stall","kind":"memory","start":"3, 0, 0","why":"Vaccines still in the box, if the next tap vaccinates, and which stall got one.","changes":"The button and the animal tap.","when":"Each vaccine.","effect":"The syringe flies there and a shield appears; Health becomes 6.","times":"3 times.","say":"They manage our 3 vaccines.","scope":"all","old":"Vax Spot"},{"name":"Animation Frame","kind":"counter","start":"1 or 2","why":"Which of 2 frames all animals show now.","changes":"The Stage: (floor(timer × 3) mod 2) + 1.","when":"3 times a second.","effect":"All animals breathe, cough and buzz together.","times":"About 180 times.","say":"Animation Frame makes every animal move.","scope":"all","old":"Anim"},{"name":"Popup Name, Popup Stall","kind":"memory","start":"(empty)","why":"Which popup to show (early, late, wrong, vax, novax) and where.","changes":"Set by an animal tap.","when":"Each tap.","effect":"The Points Popup clone wears that costume at that stall.","times":"Per tap.","say":"They choose the popup message.","scope":"all","old":"Pop, Pop Spot"},{"name":"My Spot, My Type, Where Am I, Gone","kind":"memory","start":"0","why":"Each animal clone's stall, animal type, where it is (stall, pen, carried) and if it is fading away.","changes":"Set when the clone is born and as it moves.","when":"All game.","effect":"The clone picks its costume, place and size.","times":"Per change.","say":"Each animal knows its own stall and state.","scope":"Animal","old":"MyType, Where"},{"name":"Step X, Step Y, Target X, Target Y, Steps","kind":"helper","start":"0","why":"Where the farmhand is walking and how far each step is.","changes":"Worked out before each walk.","when":"Each walk.","effect":"He walks in equal steps of about 7.","times":"Per walk.","say":"They make the farmhand walk straight.","scope":"Farmhand","old":"DX, DY, TX, TY"},{"name":"My Ring","kind":"memory","start":"0","why":"Each ring clone's stall.","changes":"The original makes 9 clones.","when":"Once.","effect":"The ring shows only if that stall is very sick.","times":"9 times.","say":"Each ring watches one stall.","scope":"Countdown Ring"}],"sprites":[{"name":"Animal","costumes":"h, e, s × 4 types × 2 frames + i (28)","animates":"Two frames switch with Animation Frame; hops home after recovery; fades when lost; rides on the farmhand's head.","clones":"9 clones.","cool":"The costume name is built from letters: e3-2 = early-signs sheep, frame 2."},{"name":"Countdown Ring","costumes":"ring 1–5","animates":"Empties as the spread time runs out.","clones":"9 clones.","cool":"Costume = ceiling(time left ÷ Spread Time × 5)."},{"name":"Farmhand","costumes":"w0–w3, stand","animates":"Walks in equal steps with 4 costumes.","clones":"No clones.","cool":"Works through the Carry Queue list."},{"name":"Shield, Syringe, Germ Cloud, Lost Marker, Points Popup","costumes":"one or more each","animates":"Grow, ease, spin, fade.","clones":"Clones for each event.","cool":"Each one is a picture for something that happened."},{"name":"Vaccine Button, Sunset","costumes":"off, on, empty / s","animates":"Button changes word; sunset fades over the farm.","clones":"No clones.","cool":"The button shows Vaccine Mode."}],"scenes":[{"n":1,"name":"Title","trigger":"Green flag","backdrop":"farm","shows":"Title, PLAY, HOW TO PLAY, farmer","ends":"PLAY"},{"n":2,"name":"How to play","trigger":"\"show help\"","backdrop":"help","shows":"Help Card","ends":"PLAY"},{"n":3,"name":"Morning on the farm","trigger":"\"start game\" → \"barn opens\"","backdrop":"farm","shows":"9 animals, farmhand, vaccine button, HUD","ends":"Half time"},{"n":4,"name":"Faster outbreak","trigger":"timer > Game Length ÷ 2","backdrop":"farm","shows":"Caption \"FASTER now\"; new cases every 2.4 s","ends":"Sunset or no animals left"},{"n":5,"name":"Sunset","trigger":"\"sunset\"","backdrop":"farm + orange overlay","shows":"Ending caption (strong, weak, empty)","ends":"After 3.5 seconds"},{"n":6,"name":"Results","trigger":"\"draw results\"","backdrop":"results","shows":"4 bars and the farmer","ends":"After 5.5 seconds"},{"n":7,"name":"Lesson, quiz, stars","trigger":"\"lesson\"","backdrop":"help","shows":"Lesson, 3 questions, stars","ends":"PLAY AGAIN"}]},"wise":{"title":"Naira Wise v2.1","school":"Yewa College","file":"Naira Wise v2.1.sb3","rename":{"H":"Bar Height","i":"Week Number","k":"Coins To Add","MyTX":"My Target X","Target X":"Jar X"},"variables":[{"name":"Pocket Money, Note Value, Weeks, Week Time","kind":"rule","start":"1,000, 100, 3, 12","why":"Money each week, naira per tap, number of weeks, seconds per week.","changes":"Only the green flag.","when":"Never during play.","effect":"They shape the whole game.","times":"Never.","say":"Our pocket money rules.","scope":"all"},{"name":"Goal Price, Emergency Week, Emergency Cost","kind":"rule","start":"1,500, 2, 300","why":"The storybook price, and when and how much the emergency costs.","changes":"Only the green flag.","when":"Never.","effect":"The goal bar and the sandal emergency use them.","times":"Never.","say":"The goal and the emergency rules.","scope":"all"},{"name":"Good Save %, Big Spend %","kind":"rule","start":"20, 80","why":"The lines for WISE and BIG SPENDER endings.","changes":"Only the green flag.","when":"Never.","effect":"Used to choose the ending.","times":"Never.","say":"The ending rules.","scope":"all"},{"name":"Week","kind":"counter","start":"0","why":"Which week we are in.","changes":"The Stage adds 1 at the start of each week.","when":"Each week.","effect":"WEEK 2/3 shows; the emergency checks Week = Emergency Week.","times":"3 times.","say":"Week counts the weeks.","scope":"all"},{"name":"Pocket ₦","kind":"counter","start":"1,000","why":"Money still in the wallet this week.","changes":"Set to Pocket Money each week; every jar tap takes 100.","when":"Each tap.","effect":"IN MY POCKET goes down; the week ends at 0.","times":"10 times a week.","say":"Pocket is money I have not planned yet.","scope":"all"},{"name":"Save ₦, Spend ₦, Give ₦","kind":"counter","start":"0","why":"Money in each jar this week.","changes":"A jar tap adds 100 to its own jar; reset each week.","when":"Each tap.","effect":"The jar costume fills; the week end uses them.","times":"Up to 10 times a week.","say":"Each jar remembers its money.","scope":"all"},{"name":"Kolo ₦","kind":"counter","start":"0","why":"All savings in the kolo.","changes":"Week end adds Save; nd Market are my two choices.","scope":"all"},{"name":"Fresh, Freshness %, Fresh Level","kind":"counter","start":"100","why":"How fresh the tomatoes are.","changes":"− Rate × 0.1 every 0.1 s; − Rain Damage in the rain.","when":"All the time on the road.","effect":"The bar shrinks; the load turns brown below 60 and gets flies below 25.","times":"About 120–250 times per trip.","say":"Fresh is the rot clock: it only goes down.","scope":"all"},{"name":"Rate, Journey, Price","kind":"memory","start":"0","why":"This trip's rot speed, length and fresh price.","changes":"Copied from the rules after your choices.","when":"Each harvest.","effect":"Used in the trip loop and the sale.","times":"Once each per harvest.","say":"They come from my choices.","scope":"all"},{"name":"Elapsed, Trip Level","kind":"counter","start":"0","why":"Seconds driven so far, and the little map position.","changes":"+0.1 every 0.1 s (not in traffic).","when":"While moving.","effect":"The trip ends when Elapsed reaches Journey.","times":"About 120–220 times.","say":"Elapsed is how far we have driven.","scope":"all"},{"name":"Rain At, Rain Done, Rain Open, Covered","kind":"memory","start":"0","why":"When rain comes, if it happened, if we are in it, and if the load is covered.","changes":"Set by the Stage and the COVER button.","when":"Once per trip.","effect":"Covered or clay pots = safe; otherwise −30.","times":"Once or twice each per trip.","say":"They run the rain storm.","scope":"all"},{"name":"Jam At, Jam Done","kind":"memory","start":"0","why":"When the go-slow starts (far market only), and if it happened.","changes":"Set by the Stage.","when":"Once per far trip.","effect":"The truck stops but freshness keeps falling.","times":"Once.","say":"They run the traffic jam.","scope":"all"},{"name":"Speed, Moving","kind":"memory","start":"0","why":"How fast the scenery moves (7 normal, 2 rain, 0 jam), and if we are on the road.","changes":"Set by the Stage.","when":"Start, rain, jam, end.","effect":"Scen IME clicked, your answer to Aunty (1 borrow, 2 send home), party running, and the result.","changes":"Buttons and the Stage.","when":"Once each.","effect":"They move the story forward.","times":"Once each.","say":"They hold my choices and the result.","scope":"all"},{"name":"Item Number","kind":"counter","start":"0","why":"Which of the 6 items a loop is checking.","changes":"Loops change it by 1.","when":"While adding joy.","effect":"Item Item Number of Picked and Joy Points is read.","times":"Many times.","say":"Item Number points at one item.","scope":"all","old":"i"},{"name":"Guests To Drop","kind":"memory","start":"0","why":"How many guests the vehicle just brought.","changes":"Each vehicle sets it before \"drop guests\".","when":"Each arrival.","effect":"That many guest clones are made.","times":"4 times.","say":"It tells the guest sprite how many to make.","scope":"all","old":"Guest N"},{"name":"Card X, Card Y, Prop X, Prop Y, Prop Size, Spot X, Spot Y, Guest Type","kind":"list","start":"numbers","why":"Where cards, props and guests go, prop sizes, and each guest's look.","changes":"Never change.","when":"Only read.","effect":"Clones look up their item.","times":"Never.","say":"They are the addresses and looks.","scope":"all"},{"name":"My Item, My Prop, My Mark, My Guest, My Spot X, My Spot Y","kind":"memory","start":"0","why":"Each clone's own number and target spot.","changes":"Set before or when cloning.","when":"Per clone.","effect":"Each clone wears its own costume and walks to its own spot.","times":"Per clone.","say":"Each clone knows who it is.","scope":"Item Card, Party Prop, Picked Mark, Guest","old":"GX, GY"}],"sprites":[{"name":"Item Card","costumes":"3 of our pictures + 3 drawn","animates":"Pop in; shake when too dear.","clones":"6 clones.","cool":"Each clone uses My Item."},{"name":"Picked Mark","costumes":"tick","animates":"Ticks redrawn after every change.","clones":"One clone per picked item.","cool":"Deletes and rebuilds on \"marks\"."},{"nam
