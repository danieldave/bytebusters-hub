<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Scratch Screen Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one column, one big card at a time, thumb-sized buttons. Colours: chalkboard green, Events yellow, Variables orange. */
:root{
  --bg:#F6F3E8; --card:#FFFFFF; --ink:#1E2A22; --muted:#5D6B61; --line:#E1DCC8;
  --board:#1F5C3A; --board-ink:#F3F7EE; --msg:#FFBF00; --msg-ink:#3A2A00; --tin:#E8730C;
  --yes:#2E7D32; --yes-bg:#E5F3E6; --no:#B3261E; --no-bg:#FBE9E7;
  --unity:#C62828; --yewa:#2E7D32; --methodist:#1565C0;
  --display:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif; --body:'Nunito', system-ui, -apple-system, Segoe UI, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131A15; --card:#1C251F; --ink:#EAF0E8; --muted:#A7B5AA; --line:#2E3A32;
  --board:#173F29; --board-ink:#EAF4E4; --msg:#F2B705; --msg-ink:#2A1E00; --tin:#F08A2C;
  --yes:#7CCB80; --yes-bg:#1E3322; --no:#F28B82; --no-bg:#3A1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131A15; --card:#1C251F; --ink:#EAF0E8; --muted:#A7B5AA; --line:#2E3A32;
  --board:#173F29; --board-ink:#EAF4E4; --msg:#F2B705; --msg-ink:#2A1E00; --tin:#F08A2C;
  --yes:#7CCB80; --yes-bg:#1E3322; --no:#F28B82; --no-bg:#3A1F1C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.board{background:var(--board);color:var(--board-ink);border-radius:18px;padding:18px 20px}
.board .k{font-weight:800;letter-spacing:.12em;font-size:12px;opacity:.85;text-transform:uppercase}
h1{font-family:var(--display);font-size:34px;line-height:1.05;margin:4px 0 6px;text-wrap:balance}
h2{font-family:var(--display);font-size:24px;margin:0;text-wrap:balance}
.board p{margin:0;font-size:16px}
.three{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.three span{font-weight:800;font-size:13px;border-radius:8px;padding:4px 8px;background:rgba(255,255,255,.14)}
.list{display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;font-weight:800;font-size:19px}
.pick small{display:block;font-weight:600;color:var(--muted);font-size:14px;margin-top:2px}
.pick .dot{width:14px;height:14px;border-radius:50%;flex:none}
.pick:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--msg);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;color:var(--muted);font-size:15px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--msg);width:0}
.tag{display:inline-block;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.t-tin{background:var(--tin);color:#fff}.t-mc,.t-pass{background:var(--msg);color:var(--msg-ink)}.t-out{background:#7C4DFF;color:#fff}.t-gate{background:#FFAB19;color:#3A2A00}.t-idea{background:var(--board);color:var(--board-ink)}
.qq{font-family:var(--display);font-size:25px;line-height:1.15;margin:0 0 14px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:700;font-size:18px;min-height:56px}
.opt.right{background:var(--yes-bg);border-color:var(--yes)}.opt.wrong{background:var(--no-bg);border-color:var(--no)}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-weight:700}
.fb.ok{background:var(--yes-bg);color:var(--yes)}.fb.bad{background:var(--no-bg);color:var(--no)}
.fb span{display:block;color:var(--ink);font-weight:600;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;border:none;border-radius:14px;padding:15px 16px;font-weight:800;font-size:18px;background:var(--board);color:var(--board-ink)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.score{font-family:var(--display);font-size:64px;line-height:1;text-align:center;margin:6px 0}
.stars{text-align:center;font-size:40px;letter-spacing:6px;color:var(--msg)}
.muted{color:var(--muted)}
.back{background:none;border:none;color:var(--muted);font-weight:800;padding:4px 0;text-align:left}
@media (prefers-reduced-motion: no-preference){.bar i{transition:width .3s}.opt{transition:background .15s,border-color .15s}}
</style>

<div class="wrap" id="app"></div>

<script>
const DATA = {"schools": {"Unity High School": ["The Empty Barn", "Middleman Maze", "Shrinking Naira"], "Yewa College": ["Naira Wise", "Race Against Rot", "The Great Owambe Budget"], "Methodist High School": ["Honest Scale", "Real vs Fake", "Family Job Board"]}, "general": [{"k": "idea", "q": "In Scratch, what is a SPRITE?", "o": ["A tin with a number", "The picture behind everything", "An actor: anything that comes out, moves or can be clicked"], "a": 2, "why": "Sprites are the actors."}, {"k": "idea", "q": "What is a BACKDROP?", "o": ["The MC", "An actor", "The picture behind everything: it shows where we are"], "a": 2, "why": "The backdrop is the cloth behind the stage play."}, {"k": "idea", "q": "What is a VARIABLE?", "o": ["A costume", "A tin with a label that keeps one number", "A message"], "a": 1, "why": "Variables remember numbers: money, time, animals left."}, {"k": "idea", "q": "What does BROADCAST do?", "o": ["Changes a costume", "Hides a sprite", "Calls a message, like the MC calling the next item"], "a": 2, "why": "Every sprite with “when I receive” that message starts its work."}, {"k": "idea", "q": "What does IF ... ELSE do?", "o": ["Starts the game", "Asks one question, then does YES or NO", "Repeats something"], "a": 1, "why": "The gateman checks before we act."}, {"k": "idea", "q": "What does REPEAT 45 do?", "o": ["Waits 45 seconds once", "Makes 45 sprites", "Does the same blocks 45 times"], "a": 2, "why": "Clap 45 times instead of writing it 45 times."}, {"k": "idea", "q": "At the green flag, what does every sprite do first?", "o": ["Say hello", "Hide (go backstage)", "Show"], "a": 1, "why": "Backstage first, come out when called."}, {"k": "idea", "q": "What are the 3 things every sprite does?", "o": ["Click, drag, drop", "Come out, work, pass it on", "Hide, wait, stop"], "a": 1, "why": "COME OUT, WORK, PASS IT ON."}], "games": {"The Empty Barn": {"story": "Six animals live in the barn. Sickness comes. Treat them EARLY, use 3 vaccines well, and keep the barn full until sunset.", "q": [{"k": "tin", "q": "At the green flag, what number goes into the tin “Time”?", "o": ["6", "45", "3"], "a": 1, "why": "The Stage fills “Time” with 45. It remembers: seconds until sunset."}, {"k": "tin", "q": "At the green flag, what number goes into the tin “Score”?", "o": ["10", "0", "5"], "a": 1, "why": "The Stage fills “Score” with 0. It remembers: points for treating animals."}, {"k": "tin", "q": "At the green flag, what number goes into the tin “Animals Left”?", "o": ["3", "6", "100"], "a": 1, "why": "The Stage fills “Animals Left” with 6. It remembers: animals still in the barn."}, {"k": "tin", "q": "At the green flag, what number goes into the tin “Vaccines Left”?", "o": ["3", "6", "10"], "a": 0, "why": "The Stage fills “Vaccines Left” with 3. It remembers: vaccines we can still use."}, {"k": "mc", "q": "Start Screen: which message does the MC call to start it?", "o": ["farm day starts", "farmer gives the result", "farmer explains"], "a": 2, "why": "“farmer explains” starts the Start Screen."}, {"k": "out", "q": "Start Screen: who COMES OUT?", "o": ["6 animals, Farmhand, Vaccine button", "Sunset (orange sky), Caption", "Farmer"], "a": 2, "why": "In the Start Screen, Farmer come out."}, {"k": "pass", "q": "Start Screen: after the work, which message is PASSED ON?", "o": ["farm day starts", "farmer gives the result", "sunset comes"], "a": 0, "why": "After the Start Screen, “farm day starts” is called."}, {"k": "mc", "q": "Day Screen: which message does the MC call to start it?", "o": ["farmer explains", "sunset comes", "farm day starts"], "a": 2, "why": "“farm day starts” starts the Day Screen."}, {"k": "out", "q": "Day Screen: who COMES OUT?", "o": ["Farmer", "6 animals, Farmhand, Vaccine button", "Sunset (orange sky), Caption"], "a": 1, "why": "In the Day Screen, 6 animals, Farmhand, Vaccine button come out."}, {"k": "pass", "q": "Day Screen: after the work, which message is PASSED ON?", "o": ["farm day starts", "THE END", "sunset comes"], "a": 2, "why": "After the Day Screen, “sunset comes” is called."}, {"k": "mc", "q": "Sunset Screen: which message does the MC call to start it?", "o": ["sunset comes", "farmer explains", "show title screen"], "a": 0, "why": "“sunset comes” starts the Sunset Screen."}, {"k": "out", "q": "Sunset Screen: who COMES OUT?", "o": ["Farmer", "6 animals, Farmhand, Vaccine button", "Sunset (orange sky), Caption"], "a": 2, "why": "In the Sunset Screen, Sunset (orange sky), Caption come out."}, {"k": "gate", "q": "Sunset Screen: what does the gateman (Caption) ask?", "o": ["Is Score more than 100?", "Is Animals Left more than 3?", "Is the green flag clicked?"], "a": 1, "why": "Caption asks: Is Animals Left more than 3? YES: \"The farm is STRONG\" NO: \"Too many were lost\""}, {"k": "pass", "q": "Sunset Screen: after the work, which message is PASSED ON?", "o": ["farmer gives the result", "THE END", "sunset comes"], "a": 0, "why": "After the Sunset Screen, “farmer gives the result” is called."}, {"k": "mc", "q": "Ending Screen: which message does the MC call to start it?", "o": ["farmer gives the result", "farmer explains", "farm day starts"], "a": 0, "why": "“farmer gives the result” starts the Ending Screen."}, {"k": "out", "q": "Ending Screen: who COMES OUT?", "o": ["Farmer", "6 animals, Farmhand, Vaccine button", "Sunset (orange sky), Caption"], "a": 0, "why": "In the Ending Screen, Farmer come out."}, {"k": "gate", "q": "Ending Screen: what does the gateman (Farmer) ask?", "o": ["Is Score more than 100?", "Is Animals Left more than 3?", "Is the green flag clicked?"], "a": 1, "why": "Farmer asks: Is Animals Left more than 3? YES: Happy: \"Early care pays!\" NO: Sad: \"Next time, act EARLY.\""}]}, "Middleman Maze": {"story": "The farmer sells tomatoes for ₦10,000. At the market the buyer pays ₦30,000. Who took the rest? Then the farmers sell together in a co-op.", "q": [{"k": "tin", "q": "At the green flag, what number goes into the tin “Trip”?", "o": ["10", "0", "5"], "a": 1, "why": "The Stage fills “Trip” with 0. It remembers: trip 1 (middlemen) or trip 2 (co-op)."}, {"k": "tin", "q": "At the green flag, what number goes into the tin “Price ₦”?", "o": ["10", "0", "1"], "a": 1, "why": "The Stage fills “Price ₦” with 0. It remembers: what the buyer will pay."}, {"k": "tin", "q": "At the green flag, what number goes into the tin “Farmer Gets ₦”?", "o": ["0", "1", "10"], "a": 0, "why": "The Stage fills “Farmer Gets ₦” with 0. It remembers: what the farmer takes home."}, {"k": "mc", "q": "Farm Screen: which message does the MC call to start it?", "o": ["trip starts", "show title screen", "truck reaches the market"], "a": 0, "why": "“trip starts” starts the Farm Screen."}, {"k": "out", "q": "Farm Screen: who COMES OUT?", "o": ["Farmer, Truck (at the farm), The 3 middlemen (at their gates)", "Farmer", "Truck, Village Buyer, Transporter, Market Seller"], "a": 0, "why": "In the Farm Screen, Farmer, Truck (at the farm), The 3 middlemen (at their gates) come out."}, {"k": "gate", "q": "Farm Screen: what does the gateman (Farmer) ask?", "o": ["Is Score more than 100?", "Is the green flag clicked?", "Is Trip = 1?"], "a": 2, "why": "Farmer asks: Is Trip = 1? YES: Price ₦10,000 and Farmer Gets ₦10,000. \"Trip 1: the middlemen.\" NO: Price ₦20,000 and Farmer Gets ₦20,000. \"Trip 2: the co-op sells for us together.\""}, {"k": "pass", "q": "Farm Screen: after the work, which message is PASSED ON?", "o": ["trip starts", "THE END", "drive to gate 1"], "a": 2, "why": "After the Farm Screen, “drive to gate 1” is called."}, {"k": "mc", "q": "Road Screen (3 Gates): which message does the MC call to start it?", "o": ["show title screen", "drive to gate 1", "truck reaches the market"], "a": 1, "why": "“drive to gate 1” starts the Road Screen (3 Gates)."}, {"k": "out", "q": "Road Screen (3 Gates): who COMES OUT?", "o": ["Farmer", "Truck, Village Buyer, Transporter, Market Seller", "Farmer, Truck (at the farm), The 3 middlemen (at their gates)"], "a": 1, "why": "In the Road Screen (3 Gates), Truck, Village Buyer, Transporter, Market Seller come out."}, {"k": "gate", "q": "Road Screen (3 Gates): what does the gateman (Each middleman) ask?", "o": ["Is Trip = 1?", "Is the green flag clicked?", "Is Score more than 100?"], "a": 0, "why": "Each middleman asks: Is Trip = 1? YES: Add my cut to the Price. NO: Trip 2: no cut (only the transporter adds ₦5,000)."}, {"k": "pass", "q": "Road Screen (3 Gates): after the work, which message is PASSED ON?", "o": ["drive to gate 1", "trip starts", "truck reaches the market"], "a": 2, "why": "After the Road Screen (3 Gates), “truck reaches the market” is called."}, {"k": "mc", "q": "Market Screen: which message does the MC call to start it?", "o": ["truck reaches the market", "show title screen", "trip starts"], "a": 0, "why": "“truck reaches the market” starts the Market Screen."}, {"k": "out", "q": "Market Screen: who COMES OUT?", "o": ["Truck, Village Buyer, Transporter, Market Seller", "Farmer, Truck (at the farm), The 3 middlemen (at their gates)", "Farmer"], "a": 2, "why": "In the Market Screen, Farmer come out."}, {"k": "gate", "q": "Market Screen: what does the gateman (Farmer) ask?", "o": ["Is the green flag clicked?", "Is Score more than 100?", "Is Trip = 1?"], "a": 2, "why": "Farmer asks: Is Trip = 1? YES: Sad: \"The buyer paid ₦30,000 but I got only ₦10,000!\" Then call trip starts again (trip 2). NO: Happy: \"The buyer paid ₦25,000 and I got ₦20,000. Together we earn more!\" THE END."}, {"k": "pass", "q": "Market Screen: after the work, which message is PASSED ON?", "o": ["THE END", "trip starts", "truck reaches the market"], "a": 1, "why": "After the Market Screen, “trip starts” is called."}]}, "Shrinking Naira": {"story": "Mum has ₦5,000 every month. Her money stays the same, but the prices go up every month. What can she still buy?", "q": [{"k": "tin", "q": "At the green flag, what number goes into the tin “Month”?", "o": ["0", "1800", "1"], "a": 2, "why": "The Stage fills “Month” with 1. It remembers: which month (1 to 4)."}, {"k": "tin", "q": "At the green flag, what number goes into the tin “Time”?", "o": ["20", "900", "5000"], "a": 0, "why": "The Stage fills “Time” with 20. It remembers: seconds left in the market."}, {"k": "tin", "q": "At the green flag, what number goes into the tin “Money ₦”?", "o": ["1800", "5000", "900"], "a": 1, "why": "The Stage fills “Money ₦” with 5000. It remembers: Mum's money now."}, {"k": "tin", "q": "At the green flag, what number goes into the tin “Foods Bought”?", "o": ["0", "20", "600"], "a": 0, "why": "The Stage fills “Foods Bought” with 0. It remembers: foods in the basket this month."}, {"k": "mc", "q": "New Month Screen: which message does the MC call to start it?", "o": ["new month starts", "show title screen", "iya oja talks"], "a": 0, "why": "“new month starts” starts the New Month Screen."}, {"k": "out", "q": "New Month Screen: who COMES OUT?", "o": ["(the foods hide)", "Calendar, Mum, Freeze button (hand)", "Price Arrow"], "a": 1, "why": "In the New Month Screen, Calendar, Mum, Freeze button (hand) come out."}, {"k": "pass", "q": "New Month Screen: after the work, which message is PASSED ON?", "o": ["market opens", "prices go up OR show the lesson", "iya oja talks"], "a": 2, "why": "After the New Month Screen, “iya oja talks” is called."}, {"k": "mc", "q": "Iya Oja Screen: which message does the MC call to start it?", "o": ["iya oja talks", "show title screen", "new month starts"], "a": 0, "why": "“iya oja talks” starts the Iya Oja Screen."}, {"k": "out", "q": "Iya Oja Screen: who COMES OUT?", "o": ["Caption, Mum", "The 5 foods, Basket (the clock)", "Iya Oja"], "a": 2, "why": "In the Iya Oja Screen, Iya Oja come out."}, {"k": "gate", "q": "Iya Oja Screen: what does the gateman (Iya Oja) ask?", "o": ["Is the green flag clicked?", "Is Score more than 100?", "Is Month = 1?"], "a": 2, "why": "Iya Oja asks: Is Month = 1? YES: \"Welcome! Fresh food today.\" NO: \"Sorry o! Price ices go up” starts the Prices Rise Screen."}, {"k": "out", "q": "Prices Rise Screen: who COMES OUT?", "o": ["Calendar, Mum, Freeze button (hand)", "Price Arrow", "Iya Oja"], "a": 1, "why": "In the Prices Rise Screen, Price Arrow come out."}, {"k": "pass", "q": "Prices Rise Screen: after the work, which message is PASSED ON?", "o": ["iya oja talks", "new month starts", "prices go up OR show the lesson"], "a": 1, "why": "After the Prices Rise Screen, “new month starts” is called."}, {"k": "mc", "q": "End Screen: which message does the MC call to start it?", "o": ["market opens", "show the lesson", "market closes"], "a": 1, "why": "“show the lesson” starts the End Screen."}, {"k": "out", "q": "End Screen: who COMES OUT?", "o": ["(the foods hide)", "The 5 foods, Basket (the clock)", "Caption, Mum"], "a": 2, "why": "In the End Screen, Caption, Mum come out."}]}, "Naira Wise": {"story": "Ada gets ₦1,000 every week for 3 weeks. She must give every ₦200 a job: SAVE, SPEND or GIVE. Can she save ₦1,000 for her storybook?", "q": [{"k": "tin", "q": "At the green flag, what number goes into the tin “Week”?", "o": ["10", "1", "0"], "a": 2, "why": "The Stage fills “Week” with 0. It remembers: which week it is (1, 2 or 3)."}, {"k": "tin", "q": "At the green flag, what number goes into the tin “Time”?", "o": ["1000", "10", "1"], "a": 1, "why": "The Stage fills “Time” with 10. It remembers: the seconds left to fill the jars."}, {"k": "tin", "q": "At the green flag, what number goes into the tin “Pocket ₦”?", "o": ["10", "0", "1000"], "a": 1, "why": "The Stage fills “Pocket ₦” with 0. It remembers: money in Ada's hand right now."}, {"k": "tin", "q": "At the green flag, what number goes into the tin “Kolo ₦”?", "o": ["10", "0", "1000"], "a": 1, "why": "The Stage fills “Kolo ₦” with 0. It remembers: Ada's savings."}, {"k": "mc", "q": "New Week Screen: which message does the MC call to start it?", "o": ["check if 3 weeks are done", "new week starts", "buy the storybook"], "a": 1, "why": const SCHOOL_COL = {'Unity High School':'var(--unity)','Yewa College':'var(--yewa)','Methodist High School':'var(--methodist)'};
const TAGS = {tin:'Tins (variables)', mc:'The MC (broadcast)', out:'Come out (show)', gate:'The gateman (if ... else)', pass:'Pass it on (broadcast)', idea:'Big idea'};
const app = document.getElementById('app');
let S = {view:'home'};
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function header(sub){return `<div class="board"><div class="k">ByteBusters · Scratch practice</div><h1>${sub||'Know your game, screen by screen'}</h1>
<p>Every sprite does 3 things:</p><div class="three"><span>COME OUT</span><span>WORK</span><span>PASS IT ON</span></div></div>`}

function home(){
  app.innerHTML = header() + `<h2>Choose your school</h2><div class="list">` +
    Object.keys(DATA.schools).map(s=>`<button class="pick" data-s="${esc(s)}"><span>${esc(s)}<small>${DATA.schools[s].map(esc).join(' · ')}</small></span><span class="dot" style="background:${SCHOOL_COL[s]}"></span></button>`).join('') +
    `<button class="pick" data-gen="1"><span>The big ideas<small>Sprite, backdrop, variable, broadcast, if-else, repeat</small></span><span class="dot" style="background:var(--msg)"></span></button></div>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S={view:'school',school:b.dataset.s};render()});
  app.querySelector('[data-gen]').onclick=()=>start('The big ideas', DATA.general, null);
}

function school(){
  const s=S.school;
  app.innerHTML = `<button class="back" id="bk">← All schools</button>` + header(s) + `<h2>Choose your game</h2><div class="list">` +
    DATA.schools[s].map(g=>{const best=store.get('best:'+g);return `<div class="card"><h2>${esc(g)}</h2><p class="muted">${esc(DATA.games[g].story)}</p>
    ${best!=null?`<p class="muted">Your best: ${best}%</p>`:''}<div class="row"><button class="btn" data-g="${esc(g)}" data-m="quick">Quick 10</button><button class="btn alt" data-g="${esc(g)}" data-m="full">All screens (${DATA.games[g].q.length})</button></div></div>`}).join('') + `</div>`;
  document.getElementById('bk').onclick=()=>{S={view:'home'};render()};
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=b.dataset.g;const qs=DATA.games[g].q;start(g, b.dataset.m==='quick'?shuffle(qs).slice(0,10):qs, s)});
}

function start(title, qs, sch){S={view:'quiz',title,qs,sch,i:0,right:0,answered:false};render()}

function quiz(){
  const q=S.qs[S.i], n=S.qs.length;
  app.innerHTML = `<button class="back" id="bk">← Stop</button><div class="card"><div class="top"><span>${esc(S.title)}</span><span>${S.i+1} / ${n}</span></div>
  <div class="bar"><i style="width:${(S.i)/n*100}%"></i></div><span class="tag t-${q.k}">${TAGS[q.k]}</span><p class="qq">${esc(q.q)}</p>
  <div class="opts">${q.o.map((o,j)=>`<button class="opt" id="o${j}" data-j="${j}">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div>`;
  document.getElementById('bk').onclick=()=>{S=S.sch?{view:'school',school:S.sch}:{view:'home'};render()};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
}

function answer(j){
  const q=S.qs[S.i];
  const fb=document.getElementById('fb');
  if(S.answered) return;
  const btn=document.getElementById('o'+j);
  if(j===q.a){
    btn.classList.add('right'); S.answered=true; if(!S.missed) S.right++;
    fb.innerHTML=`<div class="fb ok">Correct!<span>${esc(q.why)}</span></div><div class="row" style="margin-top:12px"><button class="btn" id="nx">${S.i+1<S.qs.length?'Next question':'See my score'}</button></div>`;
    document.getElementById('nx').onclick=next; document.getElementById('nx').focus();
  } else {
    btn.classList.add('wrong'); btn.disabled=true; S.missed=true;
    fb.innerHTML=`<div class="fb bad">Not that one. Try again.<span>Hint: ${esc(hint(q))}</span></div>`;
  }
}
function hint(q){return {tin:'Look at the Stage card: it fills every tin at the green flag.',mc:'Look at "Called by" on the screen card.',out:'Look at COME OUT on the screen card.',
  gate:'Look for CHECK on the screen card.',pass:'Look at PASS IT ON on the screen card.',idea:'Think of the stage play: actors, clothes, the cloth behind, tins, the MC, the gateman, clapping.'}[q.k]}
function next(){S.i++;S.answered=false;S.missed=false;if(S.i>=S.qs.length){S.view='done'};render()}

function done(){
  const pct=Math.round(S.right/S.qs.length*100);
  const prev=store.get('best:'+S.title); if(prev==null||pct>prev) store.set('best:'+S.title,pct);
  const stars=pct>=90?3:pct>=70?2:pct>=40?1:0;
  const msg=pct>=90?'Ready for the judges!':pct>=70?'Very good. One more round and you are ready.':pct>=40?'Good start. Read the screen cards again, then try once more.':'Read the screen cards with a friend, then play again.';
  app.innerHTML = header(S.title) + `<div class="card"><p class="muted" style="text-align:center;margin:0">Right on the first try</p><div class="score">${S.right} / ${S.qs.length}</div>
  <div class="stars" aria-label="${stars} of 3 stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p style="text-align:center;font-weight:800">${msg}</p>
  <div class="row"><button class="btn" id="again">Play again</button><button class="btn alt" id="menu">Choose another</button></div></div>`;
  document.getElementById('again').onclick=()=>start(S.title, S.qs.length===10?shuffle((DATA.games[S.title]||{q:DATA.general}).q).slice(0,10):S.qs, S.sch);
  document.getElementById('menu').onclick=()=>{S=S.sch?{view:'school',school:S.sch}:{view:'home'};render()};
}

function render(){({home,school,quiz,done})[S.view](); window.scrollTo(0,0)}
render();
</script>
